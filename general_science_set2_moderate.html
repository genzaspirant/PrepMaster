<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Science - Moderate Level</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{font-family:sans-serif;background:linear-gradient(135deg,#e0e7ff,#bae6fd);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;color:#0f172a} .card{background:rgba(255,255,255,0.95);border-radius:24px;box-shadow:0 20px 40px -10px rgba(59,130,246,0.2);max-width:800px;width:100%;padding:2rem} .opt-btn{border:2px solid #e2e8f0;transition:all 0.2s;border-radius:12px;padding:1rem;text-align:left;font-weight:600;width:100%;margin-bottom:0.75rem} .opt-btn:hover:not(:disabled){border-color:#3b82f6;background:#eff6ff} .correct{background:#dbeafe!important;border-color:#3b82f6!important;color:#1e40af} .wrong{background:#fee2e2!important;border-color:#ef4444!important;color:#9f1239} .hidden{display:none}</style>
</head>
<body>
    <div class="card" id="app">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-indigo-700">Gen Science: Set 2 (Moderate)</h1>
            <div class="font-bold text-slate-500">Q: <span id="q-num" class="text-indigo-600 text-xl">1</span>/50 | Score: <span id="score" class="text-indigo-600">0</span></div>
        </div>
        <div id="quiz-area">
            <h2 id="question" class="text-xl font-bold mb-6 text-slate-800"></h2>
            <div id="options"></div>
            <div id="feedback" class="mt-4 p-4 rounded-xl hidden font-medium"></div>
            <button id="next-btn" onclick="nextQ()" class="hidden mt-6 bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700 w-full">Next Question</button>
        </div>
        <div id="result-area" class="hidden text-center py-10">
            <h2 class="text-4xl font-bold text-indigo-700 mb-4">Test Completed!</h2>
            <p class="text-xl mb-6">Final Score: <span id="final-score" class="font-black text-3xl"></span> / 50</p>
            <button onclick="location.reload()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-indigo-700">Retake Quiz</button>
        </div>
    </div>
    <script>
        const qs=[
            {q:"Myopia (nearsightedness) can be corrected using which type of lens?",o:["Convex lens","Concave lens","Cylindrical lens","Bifocal lens"],a:1,e:"A concave lens diverges light rays before they reach the eye, pushing the focal point back onto the retina."},
            {q:"Brass is an alloy of which two metals?",o:["Copper and Tin","Iron and Zinc","Copper and Zinc","Aluminum and Copper"],a:2,e:"Brass is an alloy made of copper and zinc."},
            {q:"What is the average pH value of human blood?",o:["6.4","7.0","7.4","8.0"],a:2,e:"Human blood is slightly basic, with a normal pH range of 7.35 to 7.45."},
            {q:"Which endocrine gland is known as the 'Master Gland'?",o:["Thyroid","Adrenal","Pancreas","Pituitary"],a:3,e:"The pituitary gland controls the functions of many other endocrine glands."},
            {q:"The rusting of iron is an example of which chemical process?",o:["Reduction","Oxidation","Sublimation","Hydrogenation"],a:1,e:"Rusting involves iron reacting with oxygen in the presence of water (oxidation)."},
            {q:"What principle explains the spherical shape of a liquid drop?",o:["Viscosity","Atmospheric pressure","Surface tension","Capillary action"],a:2,e:"Surface tension minimizes surface area, pulling liquids into a spherical shape."},
            {q:"Which vector transmits the Dengue virus?",o:["Anopheles mosquito","Culex mosquito","Aedes aegypti mosquito","Sandfly"],a:2,e:"The Aedes aegypti mosquito is the primary vector for Dengue, Zika, and Chikungunya."},
            {q:"Isotopes of an element have the same number of protons but different numbers of:",o:["Electrons","Neutrons","Atoms","Molecules"],a:1,e:"Isotopes have different atomic masses because they have different numbers of neutrons."},
            {q:"Which of the following is a plant hormone that promotes cell division?",o:["Auxin","Gibberellin","Cytokinin","Abscisic acid"],a:2,e:"Cytokinins are plant hormones that promote cell division (cytokinesis) in plant roots and shoots."},
            {q:"What is the chemical formula for 'Laughing Gas'?",o:["NO","N2O","NO2","N2O4"],a:1,e:"Nitrous oxide (N2O) is commonly known as laughing gas."},
            {q:"The focal length of a plane mirror is:",o:["Zero","One","Infinity","Negative"],a:2,e:"A plane mirror has an infinite radius of curvature, making its focal length infinity."},
            {q:"Bile juice is secreted by which organ?",o:["Stomach","Pancreas","Gall bladder","Liver"],a:3,e:"Bile is produced by the liver and stored in the gall bladder."},
            {q:"Which radioactive isotope is used in the treatment of cancer?",o:["Iodine-131","Cobalt-60","Phosphorus-32","Carbon-14"],a:1,e:"Cobalt-60 emits gamma rays that are highly effective in destroying cancer cells."},
            {q:"What is the escape velocity of Earth?",o:["9.8 km/s","11.2 km/s","7.9 km/s","15.0 km/s"],a:1,e:"An object must reach 11.2 km/s to escape Earth's gravitational pull."},
            {q:"The 'Tyndall effect' is related to which phenomenon of light?",o:["Reflection","Refraction","Scattering","Dispersion"],a:2,e:"The Tyndall effect is the scattering of light by particles in a colloid or fine suspension."},
            {q:"Which vitamin is water-soluble?",o:["Vitamin A","Vitamin B","Vitamin D","Vitamin K"],a:1,e:"Vitamins B and C are water-soluble; A, D, E, and K are fat-soluble."},
            {q:"What is the main ore of Aluminum?",o:["Magnetite","Bauxite","Galena","Hematite"],a:1,e:"Bauxite is the primary commercial ore of aluminum."},
            {q:"Which part of the human eye is transplanted during an eye donation?",o:["Retina","Cornea","Lens","Iris"],a:1,e:"The cornea is the clear front surface of the eye and is the only part transplanted."},
            {q:"The purity of milk is measured using a:",o:["Hydrometer","Lactometer","Barometer","Galvanometer"],a:1,e:"A lactometer measures the specific gravity of milk to determine its purity."},
            {q:"A transformer works on the principle of:",o:["Self induction","Mutual induction","Ohm's law","Fleming's rule"],a:1,e:"Transformers operate on Faraday's law of induction and mutual induction between coils."},
            {q:"Which acid is present in ant stings?",o:["Acetic acid","Formic acid (Methanoic acid)","Lactic acid","Oxalic acid"],a:1,e:"Formic acid is injected by ants and bees during a sting, causing a burning sensation."},
            {q:"The SI unit of Electrical Resistance is:",o:["Volt","Ampere","Ohm","Coulomb"],a:2,e:"The Ohm (Ω) is the standard unit of electrical resistance."},
            {q:"In human digestive system, where does most of the nutrient absorption occur?",o:["Stomach","Large Intestine","Small Intestine","Esophagus"],a:2,e:"The villi in the small intestine absorb the majority of nutrients into the bloodstream."},
            {q:"Which gas is used in fire extinguishers?",o:["Oxygen","Carbon Dioxide","Nitrogen","Argon"],a:1,e:"CO2 is non-flammable and heavier than oxygen, smothering the fire."},
            {q:"Which of the following is NOT a noble gas?",o:["Helium","Neon","Radon","Chlorine"],a:3,e:"Chlorine is a halogen, not a noble gas."},
            {q:"Sound travels fastest in:",o:["Air","Water","Steel","Vacuum"],a:2,e:"Sound waves travel fastest in solids like steel due to tight particle packing."},
            {q:"What is the unit of measure for the frequency of sound?",o:["Decibel","Hertz","Mach","Weber"],a:1,e:"Frequency is measured in Hertz (Hz)."},
            {q:"Insulin is produced in the:",o:["Liver","Kidney","Pancreas","Spleen"],a:2,e:"The beta cells in the Islets of Langerhans within the pancreas produce insulin."},
            {q:"Which metal is extracted from the ore Cinnabar?",o:["Lead","Iron","Mercury","Zinc"],a:2,e:"Cinnabar (HgS) is the primary ore of Mercury."}, 
            {q:"Who is known as the Father of Genetics?",o:["Charles Darwin","Gregor Mendel","Robert Hooke","Louis Pasteur"],a:1,e:"Gregor Mendel established the fundamental laws of inheritance."},
            {q:"Electric current is measured by an instrument called:",o:["Voltmeter","Ammeter","Galvanometer","Potentiometer"],a:1,e:"An ammeter is used to measure the current in a circuit."},
            {q:"What is the function of a pacemaker in the human body?",o:["Purify blood","Regulate heartbeat","Digest food","Filter urine"],a:1,e:"A pacemaker sends electrical impulses to help the heart maintain a regular rhythm."},
            {q:"The working of a rocket is based on the principle of:",o:["Conservation of mass","Conservation of momentum","Conservation of energy","Conservation of angular momentum"],a:1,e:"Rockets operate on the principle of conservation of linear momentum (Newton's 3rd Law)."},
            {q:"What is the chemical name of Vitamin A?",o:["Thiamine","Riboflavin","Retinol","Calciferol"],a:2,e:"Retinol is the chemical name for Vitamin A, essential for vision."},
            {q:"The element common to all acids is:",o:["Oxygen","Hydrogen","Nitrogen","Carbon"],a:1,e:"All acids contain displaceable hydrogen atoms."},
            {q:"Which blood vessels carry oxygenated blood from the heart to the body?",o:["Veins","Capillaries","Arteries","Venules"],a:2,e:"Arteries carry oxygen-rich blood away from the heart (except the pulmonary artery)."},
            {q:"The twinkling of stars is due to atmospheric:",o:["Reflection","Dispersion","Refraction","Scattering"],a:2,e:"Starlight undergoes atmospheric refraction, causing the twinkling effect."},
            {q:"Dry ice is the solid form of:",o:["Water","Carbon Monoxide","Nitrogen","Carbon Dioxide"],a:3,e:"Solid Carbon Dioxide is called dry ice because it sublimates directly into gas."},
            {q:"Which non-metal is a good conductor of electricity?",o:["Phosphorus","Sulphur","Graphite","Bromine"],a:2,e:"Graphite, an allotrope of carbon, conducts electricity due to free delocalized electrons."},
            {q:"The number of chambers in a human heart is:",o:["Two","Three","Four","Five"],a:2,e:"The human heart has four chambers: two atria and two ventricles."},
            {q:"What is the unit of power of a lens?",o:["Diopter","Meter","Watt","Candela"],a:0,e:"The power of a lens is measured in Diopters (D)."},
            {q:"Enzymes are basically made up of:",o:["Carbohydrates","Proteins","Lipids","Vitamins"],a:1,e:"All enzymes are biological catalysts composed of proteins."},
            {q:"Which of the following colors of light deviates the least through a prism?",o:["Violet","Blue","Green","Red"],a:3,e:"Red light has the longest wavelength and deviates the least."},
            {q:"What connects muscle to bone?",o:["Ligament","Cartilage","Tendon","Joint"],a:2,e:"Tendons are tough fibrous connective tissues connecting muscle to bone. (Ligaments connect bone to bone)."},
            {q:"The most abundant metal in the Earth's crust is:",o:["Iron","Aluminum","Calcium","Sodium"],a:1,e:"Aluminum is the most abundant metal, while oxygen is the most abundant element overall."},
            {q:"What causes the disease 'Kala-azar'?",o:["Bacteria","Virus","Protozoa","Fungi"],a:2,e:"Kala-azar is caused by the Leishmania protozoan parasite, transmitted by sandflies."},
            {q:"An alloy of Mercury with another metal is called:",o:["Amalgam","Solder","Bronze","Brass"],a:0,e:"An amalgam is a special alloy consisting of mercury and another metal."},
            {q:"Which phenomenon proves the transverse nature of light waves?",o:["Interference","Diffraction","Polarization","Refraction"],a:2,e:"Only transverse waves can be polarized; longitudinal waves (like sound) cannot."},
            {q:"What is the chemical formula of Heavy Water?",o:["H2O2","D2O","HDO","T2O"],a:1,e:"Heavy water is Deuterium Oxide (D2O)."}
        ];

        let idx=0, score=0, locked=false;

        function loadQ(){
            locked=false; 
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('q-num').innerText=idx+1;
            document.getElementById('question').innerHTML=`${idx+1}. ${qs[idx].q}`;
            
            let optsHTML='';
            qs[idx].o.forEach((opt,i)=>{
                optsHTML+=`<button class="opt-btn" onclick="checkAns(${i}, this)">${String.fromCharCode(65+i)}. ${opt}</button>`;
            });
            document.getElementById('options').innerHTML=optsHTML;
        }

        function checkAns(ans, btn){
            if(locked) return; 
            locked=true;
            
            const correct = qs[idx].a;
            const btns = document.querySelectorAll('.opt-btn');
            
            btns.forEach((b,i)=>{
                b.disabled=true;
                if(i===correct) b.classList.add('correct');
            });
            
            let fb = document.getElementById('feedback');
            fb.classList.remove('hidden','bg-indigo-100','text-indigo-800','bg-rose-100','text-rose-800');
            
            if(ans===correct){
                score++; 
                document.getElementById('score').innerText=score;
                fb.classList.add('bg-indigo-100','text-indigo-800');
                fb.innerHTML=`<b>Correct!</b> ${qs[idx].e}`;
            } else {
                btn.classList.add('wrong');
                fb.classList.add('bg-rose-100','text-rose-800');
                fb.innerHTML=`<b>Incorrect.</b> ${qs[idx].e}`;
            }
            document.getElementById('next-btn').classList.remove('hidden');
            
            if(idx===qs.length-1) {
                document.getElementById('next-btn').innerText="Finish Quiz";
            }
        }

        function nextQ(){
            if(idx<qs.length-1){ 
                idx++; 
                loadQ(); 
            } else {
                document.getElementById('quiz-area').classList.add('hidden');
                document.getElementById('result-area').classList.remove('hidden');
                document.getElementById('final-score').innerText=score;
            }
        }

        // Initialize the first question
        loadQ();
    </script>
</body>
</html>
