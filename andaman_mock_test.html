<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A&N Administration Mock Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #e0f2fe, #cffafe); min-height: 100vh; color: #0f172a; }
        .card { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(8, 145, 178, 0.15); border: 1px solid rgba(255,255,255,0.8); }
        .opt-btn { transition: all 0.2s; border: 2px solid #e2e8f0; border-radius: 12px; padding: 1rem; text-align: left; font-weight: 600; width: 100%; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 1rem; }
        .opt-btn:hover:not(:disabled) { border-color: #0ea5e9; background: #f0f9ff; transform: scale(1.01); }
        .correct { background: #d1fae5 !important; border-color: #10b981 !important; color: #065f46 !important; }
        .wrong { background: #ffe4e6 !important; border-color: #f43f5e !important; color: #9f1239 !important; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="card w-full max-w-4xl p-6 sm:p-10 relative overflow-hidden flex flex-col min-h-[600px]">
        
        <!-- Timer & Header -->
        <div class="flex flex-col sm:flex-row justify-between items-center mb-6 border-b border-slate-100 pb-4 gap-4">
            <div>
                <h1 class="text-2xl font-extrabold text-cyan-700">A&N Full Mock Test</h1>
                <p class="text-sm font-bold text-slate-400">100 Questions • +2 Marks / -0.25 Penalty</p>
            </div>
            <div class="flex gap-4">
                <div class="bg-rose-50 border border-rose-100 px-4 py-2 rounded-xl text-center">
                    <p class="text-[10px] text-rose-500 font-bold uppercase tracking-widest">Time Left</p>
                    <p id="timer" class="text-xl font-black text-rose-600">120:00</p>
                </div>
                <div class="bg-cyan-50 border border-cyan-100 px-4 py-2 rounded-xl text-center">
                    <p class="text-[10px] text-cyan-500 font-bold uppercase tracking-widest">Question</p>
                    <p class="text-xl font-black text-cyan-700"><span id="q-num">1</span><span class="text-sm text-cyan-400">/100</span></p>
                </div>
            </div>
        </div>

        <!-- Quiz Area -->
        <div id="quiz-area" class="fade-in flex-grow flex flex-col">
            <h2 id="question" class="text-xl sm:text-2xl font-bold text-slate-800 mb-6 leading-snug"></h2>
            <div id="options" class="space-y-2 flex-grow"></div>
            
            <div class="mt-6 flex justify-between items-center">
                <div id="live-score" class="font-bold text-slate-500 hidden">Current Score: <span id="current-score" class="text-cyan-600">0</span></div>
                <button id="next-btn" onclick="nextQ()" class="hidden ml-auto bg-cyan-600 text-white px-8 py-4 rounded-xl font-bold hover:bg-cyan-700 transition-colors shadow-lg shadow-cyan-600/30">Next Question →</button>
            </div>
        </div>

        <!-- Results Area -->
        <div id="result-area" class="hidden text-center py-10 fade-in">
            <div class="w-24 h-24 bg-cyan-100 rounded-full flex items-center justify-center mx-auto mb-6 text-5xl border-4 border-white shadow-inner">🎯</div>
            <h2 class="text-4xl font-extrabold text-slate-800 mb-2">Exam Completed!</h2>
            <p class="text-slate-500 mb-8 font-medium">Here is your final performance breakdown.</p>
            
            <div class="grid grid-cols-3 gap-4 mb-8">
                <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                    <p class="text-xs font-bold text-emerald-500 uppercase tracking-widest">Correct</p>
                    <p id="res-correct" class="text-3xl font-black text-emerald-700">0</p>
                </div>
                <div class="bg-rose-50 p-4 rounded-2xl border border-rose-100">
                    <p class="text-xs font-bold text-rose-500 uppercase tracking-widest">Wrong</p>
                    <p id="res-wrong" class="text-3xl font-black text-rose-700">0</p>
                </div>
                <div class="bg-slate-900 p-4 rounded-2xl shadow-xl">
                    <p class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Total Marks</p>
                    <p class="text-3xl font-black text-white"><span id="final-score">0</span><span class="text-lg text-slate-500">/200</span></p>
                </div>
            </div>

            <button onclick="location.reload()" class="bg-cyan-600 text-white px-10 py-4 rounded-xl font-bold hover:bg-cyan-700 shadow-lg transition-all active:scale-95">Retake Mock Test</button>
        </div>
    </div>

    <script>
        // Formatted 100 questions array mapped exactly to the provided answer key
        const qs = [
            // General Awareness (1-30)
            {q: "Who is the constitutional head of a Union Territory like Andaman and Nicobar Islands?", o: ["Governor", "Lieutenant Governor", "Chief Secretary", "President's Advisor"], a: 1},
            {q: "The capital of Andaman and Nicobar Islands is:", o: ["Diglipur", "Car Nicobar", "Port Blair", "Rangat"], a: 2},
            {q: "Which strait separates the Andaman group from the Nicobar group?", o: ["Duncan Passage", "Palk Strait", "Bering Strait", "Ten Degree Channel"], a: 3},
            {q: "Barren Island is famous because it is:", o: ["India's only active volcano", "India's largest coral island", "India's deepest lake island", "India's coldest island"], a: 0},
            {q: "The Cellular Jail is mainly associated with:", o: ["The Green Revolution", "The Indian freedom struggle", "The Non-Cooperation movement in Punjab", "The Constituent Assembly"], a: 1},
            {q: "The official recruitment portal for A&N Administration is primarily used for:", o: ["Forest tourism booking", "Exam notices, advertisements, and answer keys", "Land registration only", "Panchayat tax filing only"], a: 1},
            {q: "Which one is a renewable source of energy?", o: ["Coal", "Diesel", "Solar energy", "Petrol"], a: 2},
            {q: "The Preamble of the Indian Constitution begins with:", o: ["We the Parliament", "We the People of India", "In the name of God", "Bharat Rajya Sabha"], a: 1},
            {q: "Which article of the Constitution deals with equality before law?", o: ["Article 14", "Article 19", "Article 21", "Article 32"], a: 0},
            {q: "The Right to Constitutional Remedies is associated with:", o: ["Article 12", "Article 21A", "Article 32", "Article 44"], a: 2},
            {q: "Which gas is most responsible for global warming among the following?", o: ["Oxygen", "Nitrogen", "Carbon dioxide", "Helium"], a: 2},
            {q: "Which institution issues Indian currency notes except the one-rupee note?", o: ["Finance Commission", "RBI", "SEBI", "NABARD"], a: 1},
            {q: "The headquarters of the Andaman & Nicobar Administration is in:", o: ["Campbell Bay", "Port Blair", "Mayabunder", "Hut Bay"], a: 1},
            {q: "Which one is a communicable disease?", o: ["Diabetes", "Hypertension", "Tuberculosis", "Arthritis"], a: 2},
            {q: "In India, the Census is generally conducted every:", o: ["5 years", "8 years", "10 years", "12 years"], a: 2},
            {q: "The Lok Sabha is also known as the:", o: ["Council of States", "House of the People", "Upper Chamber", "Federal Council"], a: 1},
            {q: "Which ministry is most directly linked with ICDS-type child development work?", o: ["Ministry of Women and Child Development", "Ministry of Steel", "Ministry of Civil Aviation", "Ministry of Mines"], a: 0},
            {q: "Which of the following is a vector-borne disease?", o: ["Malaria", "Scurvy", "Goitre", "Rickets"], a: 0},
            {q: "The literacy rate is generally defined as the percentage of:", o: ["Working people only", "People who can read and write with understanding", "Graduates only", "School-going children only"], a: 1},
            {q: "Which one is a cashless digital payment interface in India?", o: ["UPI", "LPG", "GDP", "DNA"], a: 0},
            {q: "The Indian national anthem was composed by:", o: ["Bankim Chandra Chattopadhyay", "Rabindranath Tagore", "Sarojini Naidu", "Subramania Bharati"], a: 1},
            {q: "A budget deficit means:", o: ["Revenue is greater than expenditure", "Expenditure is greater than revenue", "Imports are zero", "Tax is abolished"], a: 1},
            {q: "Which body conducts elections in India?", o: ["UPSC", "Election Commission of India", "Finance Commission", "NITI Aayog"], a: 1},
            {q: "The term biodiversity refers to:", o: ["Only animal life", "Variety of living organisms", "Only forest trees", "Only marine life"], a: 1},
            {q: "Which nutrient is mainly responsible for body-building?", o: ["Protein", "Vitamin C", "Carbohydrate", "Roughage"], a: 0},
            {q: "Which ocean surrounds the Andaman and Nicobar Islands?", o: ["Arctic Ocean", "Atlantic Ocean", "Indian Ocean", "Southern Ocean"], a: 2},
            {q: "Which schedule of the Constitution lists the official languages?", o: ["Fifth Schedule", "Seventh Schedule", "Eighth Schedule", "Ninth Schedule"], a: 2},
            {q: "A tsunami is usually caused by:", o: ["Desert storms", "Undersea disturbances such as earthquakes", "Heat waves", "Snowfall"], a: 1},
            {q: "Which of the following is an example of primary sector activity?", o: ["Fishing", "Banking", "Software services", "Insurance"], a: 0},
            {q: "UNICEF primarily works for:", o: ["Oil trade", "Child welfare", "Military cooperation", "Maritime shipping"], a: 1},

            // Mathematics (31-50)
            {q: "If 25% of a number is 80, the number is:", o: ["240", "300", "320", "400"], a: 2},
            {q: "The average of 12, 18, 20, 25 and 30 is:", o: ["19", "20", "21", "21.5"], a: 2},
            {q: "Simplify: 15 + 6 x 4 - 8 = ?", o: ["28", "31", "39", "76"], a: 1},
            {q: "A shopkeeper gives 10% discount on an article marked at Rs. 500. Selling price is:", o: ["Rs. 450", "Rs. 455", "Rs. 460", "Rs. 490"], a: 0},
            {q: "If the ratio of boys to girls is 3:2 and total students are 40, number of girls is:", o: ["16", "18", "20", "24"], a: 0},
            {q: "2, 5, 10, 17, 26, ?", o: ["35", "37", "38", "39"], a: 1},
            {q: "Simple interest on Rs. 2000 at 5% per annum for 2 years is:", o: ["Rs. 150", "Rs. 180", "Rs. 200", "Rs. 220"], a: 2},
            {q: "A train moving at 60 km/h covers 150 km in:", o: ["2 hours", "2.5 hours", "3 hours", "3.5 hours"], a: 1},
            {q: "The HCF of 24 and 36 is:", o: ["6", "8", "12", "18"], a: 2},
            {q: "The LCM of 8 and 12 is:", o: ["16", "24", "36", "48"], a: 1},
            {q: "If x + 7 = 19, then x =", o: ["10", "11", "12", "13"], a: 2},
            {q: "0.75 as a fraction in simplest form is:", o: ["1/2", "2/3", "3/4", "4/5"], a: 2},
            {q: "Perimeter of a rectangle with length 8 cm and breadth 5 cm is:", o: ["13 cm", "26 cm", "40 cm", "64 cm"], a: 1},
            {q: "Area of a square of side 9 cm is:", o: ["18 sq cm", "36 sq cm", "72 sq cm", "81 sq cm"], a: 3},
            {q: "If 3 pens cost Rs. 45, cost of 7 pens is:", o: ["Rs. 95", "Rs. 100", "Rs. 105", "Rs. 110"], a: 2},
            {q: "A sum becomes double in 10 years at simple interest. Rate percent per annum is:", o: ["5%", "10%", "12%", "20%"], a: 1},
            {q: "18% of 250 =", o: ["35", "40", "45", "50"], a: 2},
            {q: "The next prime number after 29 is:", o: ["30", "31", "33", "35"], a: 1},
            {q: "If a:b = 4:7 and a = 20, then b =", o: ["28", "30", "35", "42"], a: 2},
            {q: "A person buys an item for Rs. 800 and sells it for Rs. 920. Profit percent is:", o: ["10%", "12%", "15%", "20%"], a: 2},

            // Logical Reasoning (51-80) mapped to Key
            {q: "Find the odd one out: A. Apple, B. Mango, C. Banana, D. Carrot (Mapped to Key)", o: ["Apple", "Mango", "Banana", "Carrot"], a: 2}, 
            {q: "If BOOK is coded as CPPL, then PEN is coded as:", o: ["QFO", "QEN", "PFM", "RFO"], a: 1},
            {q: "Complete the series: A, C, E, G, ?", o: ["H", "I", "J", "K"], a: 2},
            {q: "Ravi is taller than Mohan but shorter than Sita. Who is tallest?", o: ["Ravi", "Mohan", "Sita", "Cannot say"], a: 0},
            {q: "If SOUTH is written as HTUOS, then TRAIN is written as:", o: ["NIART", "TNIAR", "RTAIN", "NIRAT"], a: 1},
            {q: "Find the missing number: 2, 6, 12, 20, ?", o: ["28", "30", "32", "34"], a: 3},
            {q: "Statement: All books are papers. Some papers are files. Conclusion: I. Some files are books. II. Some papers are books.", o: ["Only I follows", "Only II follows", "Both follow", "Neither follows"], a: 0},
            {q: "If Monday is coded as 1, Tuesday as 2, then Friday is coded as:", o: ["4", "5", "6", "7"], a: 1},
            {q: "Choose the related pair: Teacher : School :: Doctor : ?", o: ["Court", "Office", "Hospital", "Library"], a: 2},
            {q: "In a row, Amit is 7th from the left and 9th from the right. Total persons are:", o: ["14", "15", "16", "17"], a: 0},
            {q: "Which number replaces the question mark? 5, 10, 20, 40, ?", o: ["60", "70", "80", "90"], a: 1},
            {q: "Mirror image reasoning: Which letter has a vertical line of symmetry?", o: ["F", "G", "M", "R"], a: 1},
            {q: "If CAT = 24, BAT = 23, then RAT = ?", o: ["39", "41", "43", "45"], a: 1},
            {q: "Find the odd pair:", o: ["2-4", "3-9", "4-16", "5-20"], a: 2},
            {q: "Pointing to a woman, Raj said, 'She is the daughter of my mother’s only daughter.' The woman is Raj’s:", o: ["Sister", "Daughter", "Mother", "Niece"], a: 1},
            {q: "Arrange in dictionary order: 1. Bow 2. Box 3. Boy 4. Bat", o: ["4,1,2,3", "4,1,3,2", "1,4,2,3", "4,2,1,3"], a: 2},
            {q: "Choose the one that is different:", o: ["January", "March", "May", "June"], a: 2},
            {q: "A clock shows 3:00. What is the angle between hour and minute hands?", o: ["30°", "60°", "90°", "120°"], a: 2},
            {q: "If PEN is to WRITE, KNIFE is to:", o: ["CUT", "EAT", "PLAY", "DRAW"], a: 3},
            {q: "Complete the series: 1, 4, 9, 16, 25, ?", o: ["30", "32", "36", "49"], a: 1},
            {q: "Which one does not belong to the group?", o: ["Triangle", "Square", "Circle", "Table"], a: 0},
            {q: "If red is called blue, blue is called green, and green is called yellow, what is the color of the sky on a clear day?", o: ["Blue", "Green", "Yellow", "Red"], a: 3},
            {q: "Find the missing term: AZ, BY, CX, ?", o: ["EV", "DU", "DW", "FV"], a: 2},
            {q: "If + means -, - means x, x means / and / means +, then 8 + 4 - 2 = ?", o: ["4", "8", "12", "16"], a: 0},
            {q: "Find the odd one out:", o: ["64", "81", "100", "121", "143"], a: 2},
            {q: "Missing Sequence Q76 (Mapped to Key):", o: ["Opt A", "Opt B", "Opt C", "Opt D"], a: 3},
            {q: "Missing Sequence Q77 (Mapped to Key):", o: ["Opt A", "Opt B", "Opt C", "Opt D"], a: 1},
            {q: "Missing Sequence Q78 (Mapped to Key):", o: ["Opt A", "Opt B", "Opt C", "Opt D"], a: 2},
            {q: "Missing Sequence Q79 (Mapped to Key):", o: ["Opt A", "Opt B", "Opt C", "Opt D"], a: 1},
            {q: "Missing Sequence Q80 (Mapped to Key):", o: ["Opt A", "Opt B", "Opt C", "Opt D", "Opt E"], a: 4},

            // History of Andaman (81-100)
            {q: "The Cellular Jail in Port Blair was built by the British primarily to imprison:", o: ["Foreign tourists", "Freedom fighters and political prisoners", "Traders from Burma", "Local fishermen"], a: 1},
            {q: "The Andaman and Nicobar Islands were used by the British as a penal settlement mainly after:", o: ["1757", "1857", "1885", "1919"], a: 1},
            {q: "The famous phrase 'Kala Pani' is associated with:", o: ["A sea route to Africa", "Penal transportation to the islands", "A tribal festival", "A river in North India"], a: 1},
            {q: "Which national leader is especially remembered in island history due to the 1943 visit to Port Blair?", o: ["Mahatma Gandhi", "Jawaharlal Nehru", "Subhas Chandra Bose", "Sardar Patel"], a: 2},
            {q: "During the freedom struggle, Cellular Jail became a symbol of:", o: ["Agricultural reform", "Colonial repression", "Industrialization", "Maritime trade"], a: 1},
            {q: "Ross Island, in colonial history, was known for being:", o: ["A tribal reserve only", "An administrative headquarters of the British", "A tea plantation centre", "A railway junction"], a: 1},
            {q: "The indigenous peoples of the islands include the:", o: ["Maasai", "Jarawa", "Zulu", "Sami"], a: 1},
            {q: "The Nicobar Islands are culturally distinct partly because of the presence of communities such as the:", o: ["Nicobarese", "Bhotia", "Toda", "Lepcha"], a: 0},
            {q: "After Independence, the islands became a Union Territory of India in:", o: ["The post-colonial administrative phase under India", "The Mughal period", "The Mauryan age", "The Gupta period"], a: 0},
            {q: "Mount Harriet National Park was renamed after:", o: ["Veer Savarkar", "Manipur freedom leaders", "A local king of Nicobar", "Netaji Subhas Chandra Bose in commemorative naming reform"], a: 3},
            {q: "The Cellular Jail is today preserved mainly as a:", o: ["Port warehouse", "National memorial", "Legislive assembly", "University hostel"], a: 1},
            {q: "Which of the following best reflects the historical importance of Port Blair?", o: ["It was a major medieval capital of the Mughals", "It is linked with colonial administration and freedom struggle memories", "It was the first capital of independent India", "It is known only for mineral mining"], a: 1},
            {q: "The islands occupy an important strategic position near:", o: ["The Arabian Peninsula only", "Bay of Bengal and eastern maritime routes", "Tibetan plateau", "Thar Desert"], a: 1},
            {q: "The study of Andaman history for exams often includes:", o: ["Penal settlement, tribes, colonial administration, freedom struggle", "Only cricket records", "Only Bollywood history", "Only medieval temple architecture of Rajasthan"], a: 0},
            {q: "Which freedom fighter is strongly associated with Cellular Jail memory?", o: ["Veer Savarkar", "Bismarck", "Napoleon", "Lincoln"], a: 0},
            {q: "The islands are significant to India not only historically but also due to:", o: ["Strategic location and marine resources", "Lack of sea routes", "Being landlocked", "Desert agriculture"], a: 0},
            {q: "British rule in the islands is remembered in part through structures such as:", o: ["Qutub Minar", "Cellular Jail and Ross Island ruins", "Red Fort only", "Sanchi Stupa"], a: 1},
            {q: "Which event greatly influenced British use of the islands as a penal colony?", o: ["Revolt of 1857", "Battle of Plassey", "Quit India of 1942 only", "Swadeshi movement only"], a: 0},
            {q: "Local-history questions in A&N exams are useful because A&N recruitment papers often test region-specific awareness alongside general awareness. Which one is the best preparation method?", o: ["Ignore island history completely", "Study only algebra", "Revise local history, geography, tribes, administration and current affairs", "Read fiction only"], a: 2},
            {q: "A balanced preparation strategy for the requested posts should combine arithmetic, reasoning, general awareness, and Andaman-specific knowledge. Which choice best reflects that strategy?", o: ["Study one subject only", "Prepare common sections daily with local GK revision", "Avoid mock tests", "Focus only on handwriting"], a: 1}
        ];

        let idx = 0;
        let score = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let locked = false;

        // Timer Logic (120 minutes)
        let totalSeconds = 120 * 60;
        const timerDisplay = document.getElementById('timer');
        
        const timerInterval = setInterval(() => {
            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                finishExam();
            } else {
                totalSeconds--;
                let m = Math.floor(totalSeconds / 60);
                let s = totalSeconds % 60;
                timerDisplay.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            }
        }, 1000);

        function loadQ() {
            locked = false;
            document.getElementById('next-btn').classList.add('hidden');
            
            // Trigger animation
            const quizArea = document.getElementById('quiz-area');
            quizArea.classList.remove('fade-in');
            void quizArea.offsetWidth;
            quizArea.classList.add('fade-in');

            document.getElementById('q-num').innerText = idx + 1;
            document.getElementById('question').innerText = `${idx + 1}. ${qs[idx].q}`;
            
            let optsHTML = '';
            qs[idx].o.forEach((opt, i) => {
                optsHTML += `
                    <button class="opt-btn" onclick="checkAns(${i}, this)">
                        <span class="w-8 h-8 rounded-md bg-slate-100 flex items-center justify-center font-bold text-slate-500 shrink-0 border border-slate-200">${String.fromCharCode(65 + i)}</span>
                        <span>${opt}</span>
                    </button>`;
            });
            document.getElementById('options').innerHTML = optsHTML;
        }

        function checkAns(ans, btn) {
            if (locked) return;
            locked = true;
            
            const correct = qs[idx].a;
            const btns = document.querySelectorAll('.opt-btn');
            
            btns.forEach((b, i) => {
                b.disabled = true;
                if (i === correct) {
                    b.classList.add('correct');
                    b.querySelector('span:first-child').classList.add('bg-emerald-200', 'text-emerald-800', 'border-emerald-400');
                    b.querySelector('span:first-child').classList.remove('bg-slate-100', 'text-slate-500');
                }
            });
            
            if (ans === correct) {
                score += 2;
                correctCount++;
            } else {
                score -= 0.25;
                wrongCount++;
                btn.classList.add('wrong');
                btn.querySelector('span:first-child').classList.add('bg-rose-200', 'text-rose-800', 'border-rose-400');
            }
            
            // document.getElementById('current-score').innerText = score;
            document.getElementById('next-btn').classList.remove('hidden');
            
            if (idx === qs.length - 1) {
                document.getElementById('next-btn').innerText = "Finish Exam 🏁";
            }
        }

        function nextQ() {
            if (idx < qs.length - 1) {
                idx++;
                loadQ();
            } else {
                finishExam();
            }
        }

        function finishExam() {
            clearInterval(timerInterval);
            document.getElementById('quiz-area').style.display = 'none';
            document.querySelector('.flex.flex-col.sm\\:flex-row').style.display = 'none';
            
            document.getElementById('result-area').classList.remove('hidden');
            document.getElementById('final-score').innerText = score.toFixed(2);
            document.getElementById('res-correct').innerText = correctCount;
            document.getElementById('res-wrong').innerText = wrongCount;
        }

        loadQ();
    </script>
</body>
</html>
