<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC CGL Mock Test - Indian Polity (Set 2)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            color: #1e293b;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1);
        }
        .option-btn {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center left;
        }
        .option-btn:hover:not(.disabled) {
            transform: scale(1.01);
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }
        .correct-opt {
            background-color: #f0fdf4 !important;
            border-color: #22c55e !important;
            color: #166534 !important;
        }
        .wrong-opt {
            background-color: #fef2f2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .badge-polity {
            background: #e0e7ff;
            color: #4338ca;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6 lg:p-10">

    <main class="w-full max-w-4xl glass-card rounded-[2rem] p-6 sm:p-10 flex flex-col min-h-[650px] relative overflow-hidden">
        
        <!-- Progress Bar -->
        <div class="absolute top-0 left-0 w-full h-2 bg-slate-100">
            <div id="progress-bar" class="h-full bg-indigo-500 transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>

        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 mt-2 pb-6 border-b border-slate-100 border-dashed">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">Indian Polity</h1>
                <p class="text-sm font-bold text-slate-400 uppercase tracking-widest mt-1">SSC CGL Mock Test - Set 2</p>
            </div>
            <div class="flex items-center gap-4 bg-white px-5 py-3 rounded-2xl shadow-sm border border-slate-50">
                <div class="text-center">
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Question</p>
                    <p class="text-xl font-black text-indigo-600"><span id="q-current">1</span><span class="text-slate-300 text-sm">/50</span></p>
                </div>
                <div class="w-px h-8 bg-slate-200"></div>
                <div class="text-center">
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Score</p>
                    <p id="score-display" class="text-xl font-black text-slate-700">0</p>
                </div>
            </div>
        </header>

        <div id="quiz-area" class="flex-grow flex flex-col fade-in">
            <div class="mb-6">
                <span class="badge-polity mb-4 inline-block">Constitution & Governance</span>
                <h2 id="question-text" class="text-xl sm:text-2xl font-bold text-slate-800 leading-snug">Loading question...</h2>
            </div>

            <div id="options-container" class="space-y-3 mt-auto custom-scroll overflow-y-auto pr-2 pb-2">
                <!-- Options injected by JavaScript -->
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4 min-h-[90px]">
            <div id="feedback-area" class="w-full sm:w-2/3 hidden p-4 rounded-xl text-sm font-semibold leading-relaxed border"></div>
            <button id="next-btn" class="hidden w-full sm:w-1/3 px-8 py-4 bg-slate-900 hover:bg-indigo-600 text-white font-bold rounded-xl transition-all shadow-lg active:scale-95 whitespace-nowrap text-lg">
                Next <span class="ml-2">→</span>
            </button>
        </div>

        <div id="result-area" class="hidden flex-col items-center justify-center text-center py-8 flex-grow fade-in">
            <div class="w-24 h-24 mb-6 rounded-full bg-indigo-50 flex items-center justify-center border-4 border-white shadow-xl">
                <span class="text-5xl">🏛️</span>
            </div>
            <h2 class="text-4xl font-extrabold text-slate-800 mb-3 tracking-tight">Test Completed!</h2>
            <p class="text-slate-500 mb-10 text-lg font-medium">You have successfully completed Polity Set 2.</p>
            
            <div class="grid grid-cols-2 gap-6 w-full max-w-md mb-10">
                <div class="bg-white border border-slate-100 shadow-sm p-6 rounded-2xl relative overflow-hidden">
                    <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-2">Final Score</p>
                    <p class="text-4xl font-black text-slate-800"><span id="final-score">0</span><span class="text-lg text-slate-400 font-medium">/50</span></p>
                </div>
                <div class="bg-slate-900 shadow-xl p-6 rounded-2xl relative overflow-hidden">
                    <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-2">Accuracy</p>
                    <p id="final-accuracy" class="text-4xl font-black text-indigo-400">0%</p>
                </div>
            </div>

            <button onclick="location.reload()" class="px-10 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-lg active:scale-95 text-lg">
                Retake Exam
            </button>
        </div>
    </main>

    <script>
        const polityData = [
            { q: "Who is known as the Father of the Indian Constitution?", options: ["Mahatma Gandhi", "Dr. B.R. Ambedkar", "Jawaharlal Nehru", "Rajendra Prasad"], a: 1, exp: "Dr. B.R. Ambedkar was the Chairman of the Drafting Committee and played the most critical role in framing the Constitution." },
            { q: "Which Article of the Indian Constitution deals with the Right to Equality?", options: ["Articles 14–18", "Articles 19–22", "Articles 23–24", "Articles 12–13"], a: 0, exp: "Articles 14 to 18 of the Indian Constitution guarantee the Right to Equality to all citizens." },
            { q: "The idea of the Directive Principles of State Policy (DPSP) was borrowed from the Constitution of:", options: ["USA", "Ireland", "UK", "Canada"], a: 1, exp: "DPSPs were inspired by the Irish Constitution, which in turn had copied it from the Spanish Constitution." },
            { q: "Which Article provides for the impeachment of the President of India?", options: ["Article 56", "Article 61", "Article 72", "Article 75"], a: 1, exp: "Article 61 lays down the detailed procedure for the impeachment of the President for 'violation of the Constitution'." },
            { q: "The President of India is elected by:", options: ["The people directly", "Members of Parliament only", "An Electoral College", "Rajya Sabha only"], a: 2, exp: "The President is elected by an Electoral College consisting of elected MPs of both houses and elected MLAs of the states." },
            { q: "Which of the following is NOT a Fundamental Right under the Indian Constitution?", options: ["Right to Freedom", "Right to Property", "Right to Equality", "Right to Education"], a: 1, exp: "The Right to Property was removed from the list of Fundamental Rights by the 44th Amendment Act, 1978, and is now a legal right under Article 300A." },
            { q: "Who appoints the Chief Justice of India?", options: ["Prime Minister", "President", "Parliament", "Law Minister"], a: 1, exp: "The President of India appoints the Chief Justice of India and the other judges of the Supreme Court." },
            { q: "Which amendment lowered the voting age from 21 years to 18 years?", options: ["42nd Amendment", "43rd Amendment", "44th Amendment", "61st Amendment"], a: 3, exp: "The 61st Constitutional Amendment Act (1989) reduced the voting age to 18 years." },
            { q: "Who has the power to dissolve the Lok Sabha?", options: ["Prime Minister", "President", "Speaker", "Chief Justice"], a: 1, exp: "The President has the power to summon, prorogue the Parliament, and dissolve the Lok Sabha, usually on the advice of the Council of Ministers." },
            { q: "The concept of Fundamental Rights is borrowed from the Constitution of:", options: ["USA", "UK", "France", "Germany"], a: 0, exp: "The Fundamental Rights in India were heavily inspired by the American Bill of Rights." },
            
            { q: "The Union Public Service Commission (UPSC) is mentioned in which part of the Constitution?", options: ["Part XIV", "Part XV", "Part XVI", "Part XVII"], a: 0, exp: "UPSC is mentioned under Part XIV (Articles 315–323) which deals with Services under the Union and the States." },
            { q: "Which of the following is NOT part of the Parliament of India?", options: ["President", "Lok Sabha", "Rajya Sabha", "Governor"], a: 3, exp: "Under Article 79, the Parliament of India consists of the President, Lok Sabha (House of the People), and Rajya Sabha (Council of States)." },
            { q: "The Rajya Sabha is also known as the:", options: ["Upper House", "House of the People", "Legislative Assembly", "Federal House"], a: 0, exp: "The Rajya Sabha is the Upper House (Council of States) of the bicameral Parliament of India." },
            { q: "Who presides over the joint sitting of Parliament?", options: ["President", "Speaker of Lok Sabha", "Vice President", "Prime Minister"], a: 1, exp: "The Speaker of the Lok Sabha presides over a joint session of Parliament (summoned under Article 108)." },
            { q: "Which schedule of the Constitution deals with the division of powers between the Union and States?", options: ["Fifth Schedule", "Sixth Schedule", "Seventh Schedule", "Ninth Schedule"], a: 2, exp: "The Seventh Schedule contains the Union List, State List, and Concurrent List." },
            { q: "Which Constitutional Amendment is often called the 'Mini Constitution of India'?", options: ["24th Amendment", "42nd Amendment", "44th Amendment", "73rd Amendment"], a: 1, exp: "The 42nd Amendment Act of 1976 brought widespread changes to the Constitution during the Emergency, earning the nickname 'Mini Constitution'." },
            { q: "Under which constitutional amendment act was the Preamble of the Constitution amended to add 'Socialist, Secular, Integrity'?", options: ["52nd", "56th", "44th", "42nd"], a: 3, exp: "The 42nd Amendment (1976) added the words Socialist, Secular, and Integrity to the Preamble." },
            { q: "Under which of the following Amendments is defection to another party after an election made illegal?", options: ["92nd", "61st", "52nd", "86th"], a: 2, exp: "The 52nd Amendment Act of 1985 added the Tenth Schedule, introducing the Anti-Defection Law." },
            { q: "Which Constitutional Amendment gave constitutional status to the Panchayati Raj Institutions?", options: ["86th Amendment Act", "71st Amendment Act", "73rd Amendment Act", "92nd Amendment Act"], a: 2, exp: "The 73rd Amendment Act, 1992 (effective 1993) constitutionalized Panchayati Raj Institutions by adding Part IX." },
            { q: "Which committee recommended the inclusion of Fundamental Duties in the Constitution?", options: ["Tarapore Committee", "Radha Krishnan Committee", "Swaran Singh Committee", "Balwantrai Mehta Committee"], a: 2, exp: "The Swaran Singh Committee (1976) recommended the inclusion of Fundamental Duties, leading to their addition via the 42nd Amendment." },

            { q: "Which article of the constitution guarantees 'Equality Before Law'?", options: ["Article 18", "Article 14", "Article 22", "Article 13"], a: 1, exp: "Article 14 states that the State shall not deny to any person equality before the law or the equal protection of the laws." },
            { q: "Which Schedule of the Constitution was added by the First Amendment of the Indian Constitution (1951)?", options: ["Tenth Schedule", "Ninth Schedule", "Eighth Schedule", "Fifth Schedule"], a: 1, exp: "The Ninth Schedule was added by the 1st Amendment (1951) to protect land reform and other laws from judicial review." },
            { q: "The right to privacy in India is primarily safeguarded under which Article?", options: ["Article 21", "Article 20", "Article 24", "Article 19"], a: 0, exp: "The Supreme Court (Puttaswamy case) declared the Right to Privacy as an intrinsic part of the Right to Life and Personal Liberty under Article 21." },
            { q: "Which article declares that the State shall provide free and compulsory education to all children of the age of six to fourteen years?", options: ["Article 45", "Article 21A", "Article 30", "Article 44"], a: 1, exp: "Article 21A, added by the 86th Amendment Act (2002), makes education a fundamental right for children aged 6-14." },
            { q: "Separation of the Judiciary from the Executive is mentioned in which article (DPSP)?", options: ["Article 47", "Article 38", "Article 51A", "Article 50"], a: 3, exp: "Article 50 of the Directive Principles of State Policy directs the State to separate the judiciary from the executive in public services." },
            { q: "Which Article of the Indian Constitution grants the President the power to pardon, commute, or reduce sentences?", options: ["Article 71", "Article 73", "Article 72", "Article 70"], a: 2, exp: "Article 72 grants the President the pardoning powers, including the power to commute death sentences." },
            { q: "Which article of the constitution mentions that the Attorney General of India is the highest law officer of India?", options: ["Article 77", "Article 75", "Article 78", "Article 76"], a: 3, exp: "Article 76 provides for the office of the Attorney General for India, the highest law officer in the country." },
            { q: "The Council of Ministers is collectively responsible to the Lok Sabha according to which article?", options: ["Article 74(1)", "Article 75(3)", "Article 78", "Article 77"], a: 1, exp: "Article 75(3) strictly states that the Council of Ministers shall be collectively responsible to the House of the People (Lok Sabha)." },
            { q: "Definition of 'Money Bills' is detailed in which Article?", options: ["Article 108", "Article 110", "Article 112", "Article 111"], a: 1, exp: "Article 110 details the definition of a Money Bill. A bill is deemed to be a money bill if it contains provisions dealing exclusively with taxation, borrowing, etc." },
            { q: "Which article of the Indian Constitution grants the President the power to promulgate ordinances?", options: ["Article 124", "Article 66", "Article 122", "Article 123"], a: 3, exp: "Article 123 grants the President the power to promulgate Ordinances during the recess of Parliament." },

            { q: "The President can declare a Financial Emergency under which Article of the Constitution?", options: ["Article 360", "Article 352", "Article 356", "Article 350"], a: 0, exp: "Article 360 empowers the President to proclaim a Financial Emergency. It has never been declared in India so far." },
            { q: "The maximum strength of the Lok Sabha allowed by the Constitution is:", options: ["545", "550", "552", "543"], a: 1, exp: "The maximum strength is 550. (Previously 552, but the 104th Amendment removed the 2 nominated Anglo-Indian seats)." },
            { q: "Under which article can the President declare a Constitutional Emergency (President's Rule) in a state?", options: ["Article 32", "Article 356", "Article 360", "Article 352"], a: 1, exp: "Article 356 deals with the failure of constitutional machinery in states, commonly known as President's Rule." },
            { q: "What is the minimum age required for becoming a Governor of a state in India?", options: ["30 years", "25 years", "35 years", "45 years"], a: 2, exp: "Under Article 157, the minimum age required to become a Governor is 35 years." },
            { q: "Right to Information (RTI) is essentially a:", options: ["Fundamental right", "Legal right", "Neither fundamental nor legal", "Constitutional right"], a: 1, exp: "The Right to Information is a Legal Right established by the RTI Act, 2005, though it implicitly flows from Article 19(1)(a)." },
            { q: "Who is the final authority for interpreting the Indian Constitution?", options: ["Parliament", "Supreme Court of India", "President", "Attorney General"], a: 1, exp: "The Supreme Court of India is the highest judicial court and the ultimate interpreter and guardian of the Constitution." },
            { q: "The Residuary powers of legislation under the Indian Constitution rest with:", options: ["State Legislatures", "Parliament", "President", "Supreme Court"], a: 1, exp: "Article 248 vests the residuary powers of legislation (subjects not enumerated in the Concurrent or State lists) exclusively with the Parliament." },
            { q: "Who among the following is NOT a member of the National Development Council (NDC)?", options: ["Prime Minister", "Chief Ministers of States", "President of India", "Members of NITI Aayog"], a: 2, exp: "The President of India is not a member of the NDC. It comprises the PM, Union Cabinet Ministers, Chief Ministers, and NITI Aayog members." },
            { q: "A Money Bill can only be introduced in:", options: ["Rajya Sabha", "Lok Sabha", "Both Houses simultaneously", "Joint Sitting"], a: 1, exp: "Under Article 109, a Money Bill shall not be introduced in the Council of States (Rajya Sabha). It can only be introduced in the Lok Sabha." },
            { q: "Which parliamentary committee in India is conventionally chaired by a prominent member of the opposition?", options: ["Estimates Committee", "Public Accounts Committee (PAC)", "Committee on Public Undertakings", "Rules Committee"], a: 1, exp: "By convention since 1967, the Chairman of the Public Accounts Committee (PAC) is selected from the Opposition." },

            { q: "A bill becomes an Act of Parliament after being passed by both houses and assented to by the:", options: ["Prime Minister", "Vice President", "President", "Speaker of the Lok Sabha"], a: 2, exp: "Article 111 states that after a bill is passed by both Houses, it must be presented to the President for assent to become an Act." },
            { q: "Which Article of the Constitution lays down the process for introducing changes (Amendments) in the Constitution?", options: ["Article 342", "Article 351", "Article 374", "Article 368"], a: 3, exp: "Article 368 in Part XX deals with the power of Parliament to amend the Constitution and its procedures." },
            { q: "The 74th Amendment Act of 1992 added which new Part to the Constitution of India?", options: ["Part X", "Part IX-A", "Part IX", "Part VIII"], a: 1, exp: "The 74th Amendment Act added Part IX-A to the Constitution, dealing with Municipalities (urban local government)." },
            { q: "Which Article prohibits the employment of children below the age of 14 years in factories or hazardous employment?", options: ["Article 23", "Article 26", "Article 24", "Article 25"], a: 2, exp: "Article 24 explicitly prohibits the employment of children in factories, mines, or any other hazardous employment." },
            { q: "The Election Commission of India (ECI) is established under which Article?", options: ["Article 356", "Article 324", "Article 352", "Article 101"], a: 1, exp: "Article 324 provides for the establishment of an independent Election Commission to ensure free and fair elections." },
            { q: "The Constituent Assembly adopted the National Anthem in which year?", options: ["May 1947", "January 1950", "January 1948", "July 1949"], a: 1, exp: "The Constituent Assembly adopted 'Jana Gana Mana' as the National Anthem on January 24, 1950." },
            { q: "How many women representatives were there in the Constituent Assembly that framed the Constitution?", options: ["12", "10", "14", "15"], a: 3, exp: "The Constituent Assembly, formed in 1946, included 15 prominent women members." },
            { q: "Who is the ex-officio President of the Indian Parliamentary Group (IPG)?", options: ["Vice President", "Prime Minister", "President", "Speaker of the Lok Sabha"], a: 3, exp: "The Speaker of the Lok Sabha acts as the ex-officio President of the Indian Parliamentary Group (IPG)." },
            { q: "The Constitution of India guarantees which of the following to the states of India?", options: ["Territorial Integrity", "Sovereignty", "Right to secede from Union", "None of them"], a: 3, exp: "India is an indestructible union of destructible states. States do not have territorial integrity guaranteed, nor the right to secede." },
            { q: "In which year was the Dogri language included in the Eighth Schedule of the Indian Constitution?", options: ["2001", "2002", "2003", "2004"], a: 2, exp: "The 92nd Amendment Act of 2003 added Bodo, Dogri, Maithili, and Santhali to the Eighth Schedule." }
        ];

        let currentIdx = 0;
        let score = 0;
        let answered = false;

        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const qCounter = document.getElementById('q-current');
        const nextBtn = document.getElementById('next-btn');
        const feedbackArea = document.getElementById('feedback-area');
        const progressBar = document.getElementById('progress-bar');
        const scoreDisplay = document.getElementById('score-display');

        function renderQuestion() {
            // Reset state
            answered = false;
            nextBtn.classList.add('hidden');
            feedbackArea.classList.add('hidden');
            feedbackArea.innerHTML = '';
            
            // Re-trigger animation
            const quizArea = document.getElementById('quiz-area');
            quizArea.classList.remove('fade-in');
            void quizArea.offsetWidth; // Trigger reflow
            quizArea.classList.add('fade-in');

            const currentQ = polityData[currentIdx];
            
            // Populate text
            qText.innerHTML = currentQ.q;
            qCounter.innerText = currentIdx + 1;
            
            // Update Progress
            const progressPct = ((currentIdx) / polityData.length) * 100;
            progressBar.style.width = `${progressPct}%`;

            optionsContainer.innerHTML = '';
            currentQ.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-4 rounded-xl border border-slate-200 bg-white text-left font-semibold text-slate-700 flex items-center gap-4";
                btn.innerHTML = `
                    <span class="w-8 h-8 rounded-md bg-slate-100 text-slate-500 flex items-center justify-center font-bold text-sm shrink-0 shadow-sm border border-slate-200">
                        ${String.fromCharCode(65 + index)}
                    </span>
                    <span class="text-base">${opt}</span>
                `;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, btnElement) {
            if (answered) return;
            answered = true;

            const currentQ = polityData[currentIdx];
            const correctIndex = currentQ.a;
            const allButtons = optionsContainer.querySelectorAll('button');

            // Disable all buttons
            allButtons.forEach((btn, i) => {
                btn.classList.add('disabled', 'cursor-not-allowed', 'opacity-60');
                
                // Highlight correct answer
                if (i === correctIndex) {
                    btn.classList.add('correct-opt', 'opacity-100', 'shadow-md');
                    btn.classList.remove('opacity-60', 'border-slate-200');
                    btn.querySelector('span:first-child').classList.add('bg-green-200', 'text-green-900', 'border-green-300');
                    btn.querySelector('span:first-child').classList.remove('bg-slate-100', 'text-slate-500', 'border-slate-200');
                }
            });

            feedbackArea.classList.remove('hidden');

            if (selectedIndex === correctIndex) {
                score++;
                scoreDisplay.innerText = score;
                feedbackArea.classList.add('bg-green-50', 'text-green-800', 'border-green-200');
                feedbackArea.classList.remove('bg-red-50', 'text-red-800', 'border-red-200');
                feedbackArea.innerHTML = `<span class="flex items-start gap-2"><span class="text-xl leading-none mt-0.5">✅</span> <span><strong class="block mb-1 text-green-900">Correct!</strong> ${currentQ.exp}</span></span>`;
            } else {
                // Highlight wrong selection
                btnElement.classList.remove('opacity-60');
                btnElement.classList.add('wrong-opt', 'opacity-100', 'shadow-md');
                btnElement.querySelector('span:first-child').classList.add('bg-red-200', 'text-red-900', 'border-red-300');
                btnElement.querySelector('span:first-child').classList.remove('bg-slate-100', 'border-slate-200');

                feedbackArea.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                feedbackArea.classList.remove('bg-green-50', 'text-green-800', 'border-green-200');
                feedbackArea.innerHTML = `<span class="flex items-start gap-2"><span class="text-xl leading-none mt-0.5">❌</span> <span><strong class="block mb-1 text-red-900">Incorrect.</strong> ${currentQ.exp}</span></span>`;
            }

            nextBtn.classList.remove('hidden');
            if (currentIdx === polityData.length - 1) {
                nextBtn.innerHTML = "View Results <span class='ml-2'>🏅</span>";
            }
        }

        nextBtn.onclick = () => {
            if (currentIdx < polityData.length - 1) {
                currentIdx++;
                renderQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            progressBar.style.width = `100%`;
            document.getElementById('quiz-area').classList.add('hidden');
            document.querySelector('header').classList.add('hidden');
            document.getElementById('next-btn').parentElement.classList.add('hidden');
            
            const resultArea = document.getElementById('result-area');
            resultArea.classList.remove('hidden');
            resultArea.classList.add('flex');
            
            const accuracy = Math.round((score / polityData.length) * 100);
            
            // Counter animation
            let currentAcc = 0;
            const interval = setInterval(() => {
                if (currentAcc >= accuracy) {
                    clearInterval(interval);
                    document.getElementById('final-accuracy').innerText = `${accuracy}%`;
                } else {
                    currentAcc += (accuracy > 50 ? 2 : 1);
                    document.getElementById('final-accuracy').innerText = `${Math.min(currentAcc, accuracy)}%`;
                }
            }, 30);

            document.getElementById('final-score').innerText = score;
        }

        // Boot up
        window.onload = renderQuestion;
    </script>
</body>
</html>
