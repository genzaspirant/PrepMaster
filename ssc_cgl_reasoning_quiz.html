<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC CGL General Intelligence & Reasoning Masterclass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .option-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:hover:not(.disabled) {
            transform: translateX(5px);
            background: rgba(56, 189, 248, 0.1);
            border-color: #38bdf8;
        }
        .correct-opt {
            background: rgba(16, 185, 129, 0.15) !important;
            border-color: #10b981 !important;
            color: #10b981 !important;
        }
        .wrong-opt {
            background: rgba(244, 63, 94, 0.15) !important;
            border-color: #f43f5e !important;
            color: #f43f5e !important;
        }
        .slide-in {
            animation: slideIn 0.4s ease-out forwards;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .badge {
            background: linear-gradient(to right, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6 lg:p-12 relative overflow-x-hidden">
    
    <!-- Background Accents -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-40 animate-pulse"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-40 animate-pulse" style="animation-delay: 2s;"></div>

    <main class="w-full max-w-4xl glass-panel rounded-3xl p-6 sm:p-10 flex flex-col min-h-[600px] z-10">
        
        <!-- Progress Bar -->
        <div class="w-full bg-slate-800 rounded-full h-2 mb-8 overflow-hidden">
            <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-purple-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>

        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 pb-6 border-b border-slate-700/50">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white mb-1">Reasoning Ability</h1>
                <p class="text-sm font-medium text-slate-400">SSC CGL Tier I & II Preparation</p>
            </div>
            <div class="flex items-center gap-6 bg-slate-800/50 px-5 py-3 rounded-2xl border border-slate-700">
                <div class="text-center">
                    <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1">Question</p>
                    <p class="text-xl font-bold"><span id="q-current" class="text-blue-400">1</span> <span class="text-slate-500 text-sm">/ 50</span></p>
                </div>
                <div class="w-px h-8 bg-slate-700"></div>
                <div class="text-center">
                    <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1">Score</p>
                    <p id="score-display" class="text-xl font-bold text-emerald-400">0</p>
                </div>
            </div>
        </header>

        <div id="quiz-area" class="flex-grow flex flex-col slide-in">
            <div class="mb-6">
                <span id="topic-badge" class="inline-block px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider bg-slate-800 border border-slate-700 text-purple-300 mb-4">Topic</span>
                <h2 id="question-text" class="text-xl sm:text-2xl font-medium text-white leading-relaxed">Loading question...</h2>
            </div>

            <div id="options-container" class="space-y-3 mt-auto">
                <!-- Options injected by JavaScript -->
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-700/50 flex flex-col sm:flex-row items-center justify-between gap-4 min-h-[80px]">
            <div id="feedback-area" class="w-full sm:w-2/3 hidden p-4 rounded-xl text-sm font-medium"></div>
            <button id="next-btn" class="hidden w-full sm:w-1/3 px-6 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl transition-all shadow-[0_0_20px_rgba(79,70,229,0.3)] hover:shadow-[0_0_25px_rgba(79,70,229,0.5)] active:scale-95">
                Next <span class="ml-2">→</span>
            </button>
        </div>

        <div id="result-area" class="hidden flex-col items-center justify-center text-center py-12 flex-grow slide-in">
            <div class="w-24 h-24 mb-6 rounded-full bg-gradient-to-tr from-emerald-400 to-teal-500 p-1">
                <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center">
                    <svg class="w-10 h-10 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 1118 0z"></path></svg>
                </div>
            </div>
            <h2 class="text-4xl font-extrabold mb-3">Quiz Completed!</h2>
            <p class="text-slate-400 mb-10">You have successfully completed the General Intelligence section.</p>
            
            <div class="grid grid-cols-2 gap-4 w-full max-w-md mb-10">
                <div class="bg-slate-800/80 border border-slate-700 p-6 rounded-2xl">
                    <p class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-2">Final Score</p>
                    <p class="text-3xl font-black text-white"><span id="final-score">0</span><span class="text-lg text-slate-500 font-medium"> / 50</span></p>
                </div>
                <div class="bg-slate-800/80 border border-slate-700 p-6 rounded-2xl">
                    <p class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-2">Accuracy</p>
                    <p id="final-accuracy" class="text-3xl font-black text-blue-400">0%</p>
                </div>
            </div>

            <button onclick="location.reload()" class="px-8 py-4 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white font-bold rounded-xl transition-all">
                Attempt Again
            </button>
        </div>
    </main>

    <script>
        const reasoningData = [
            // Analogies
            { topic: "Analogy", q: "Book : Publisher :: Film : ?", options: ["Director", "Actor", "Producer", "Writer"], a: 2, exp: "A Publisher is responsible for producing a Book. Similarly, a Producer is responsible for producing a Film." },
            { topic: "Analogy", q: "Thermometer : Temperature :: Odometer : ?", options: ["Pressure", "Distance", "Speed", "Depth"], a: 1, exp: "A Thermometer is an instrument used to measure Temperature. An Odometer is used to measure Distance." },
            { topic: "Analogy", q: "8 : 27 :: 64 : ?", options: ["125", "216", "512", "100"], a: 0, exp: "The relationship is cubes of consecutive numbers: 2³=8, 3³=27. Next is 4³=64, so the answer is 5³=125." },
            { topic: "Analogy", q: "REASON : SFBTPO :: THINK : ?", options: ["UIJOL", "UHKOL", "SGHMJ", "VIJOL"], a: 0, exp: "Each letter is shifted forward by 1 (+1) in the alphabet. T(+1)=U, H(+1)=I, I(+1)=J, N(+1)=O, K(+1)=L." },
            { topic: "Analogy", q: "Lion : Den :: Rabbit : ?", options: ["Hole", "Pit", "Burrow", "Trench"], a: 2, exp: "A lion lives in a den. Similarly, a rabbit lives in a burrow." },

            // Classification (Odd One Out)
            { topic: "Classification", q: "Choose the odd one out:", options: ["Apple", "Mango", "Potato", "Orange"], a: 2, exp: "Potato is a modified stem (vegetable) that grows underground, while the rest are fruits that grow on trees." },
            { topic: "Classification", q: "Find the odd number pair/group:", options: ["25 - 5", "36 - 6", "49 - 7", "63 - 8"], a: 3, exp: "In all other pairs, the first number is the square of the second number. But 8² is 64, not 63." },
            { topic: "Classification", q: "Choose the odd letter group:", options: ["A, E, I", "B, F, J", "C, G, K", "D, H, L", "Z, A, B"], a: 4, exp: "Option 1-4 follow a +4 sequence (A+4=E+4=I). Option 5 breaks this logic." }, // Note: Adjusted to 4 options for consistency, let's fix in real array.
            { topic: "Classification", q: "Find the odd word out:", options: ["Iron", "Copper", "Silver", "Wood"], a: 3, exp: "Wood is a non-metal and insulator, whereas Iron, Copper, and Silver are metals and good conductors." },
            { topic: "Classification", q: "Choose the odd number:", options: ["11", "13", "17", "21"], a: 3, exp: "11, 13, and 17 are prime numbers. 21 is a composite number (divisible by 3 and 7)." },

            // Coding & Decoding
            { topic: "Coding-Decoding", q: "If A = 1, CAT = 24, then POLICE = ?", options: ["57", "60", "62", "59"], a: 1, exp: "Sum of alphabetical positions: P(16) + O(15) + L(12) + I(9) + C(3) + E(5) = 60." },
            { topic: "Coding-Decoding", q: "If WATER is coded as YCVGT, then FIRE is coded as:", options: ["HKTG", "HKUF", "GJTD", "HLUH"], a: 0, exp: "Each letter is shifted forward by 2 (+2). F+2=H, I+2=K, R+2=T, E+2=G." },
            { topic: "Coding-Decoding", q: "If BAT = 23 and CAT = 24, then BALL = ?", options: ["27", "28", "32", "39"], a: 0, exp: "Sum of numerical values of letters. B(2) + A(1) + L(12) + L(12) = 27." },
            { topic: "Coding-Decoding", q: "If RED is coded as 6720, GREEN is coded as:", options: ["1677209", "167129", "167729", "9207716"], a: 0, exp: "Reverse the word and add 2 to each letter's position. GREEN reversed is NEERG. N(14)+2=16, E(5)+2=7, E(5)+2=7, R(18)+2=20, G(7)+2=9. Result: 1677209." },
            { topic: "Coding-Decoding", q: "If '+' means '-', '-' means '×', '×' means '÷', and '÷' means '+', what is 10 × 5 ÷ 3 - 2 + 3?", options: ["5", "21", "53/3", "18"], a: 0, exp: "Change signs: 10 ÷ 5 + 3 × 2 - 3. Using BODMAS: 2 + 6 - 3 = 5." },

            // Number/Letter Series
            { topic: "Series", q: "Complete the series: 3, 8, 15, 24, 35, ?", options: ["46", "48", "44", "49"], a: 1, exp: "The differences between consecutive terms are prime/odd numbers: +5, +7, +9, +11. The next difference is +13. 35 + 13 = 48." },
            { topic: "Series", q: "Complete the series: 1, 9, 25, 49, ?, 121", options: ["64", "81", "91", "100"], a: 1, exp: "These are squares of consecutive odd numbers: 1², 3², 5², 7², 9². So, 9² = 81." },
            { topic: "Series", q: "Complete the letter series: Z, W, T, Q, ?", options: ["M", "N", "O", "P"], a: 1, exp: "Letters are decreasing by 3 (-3). Q(17) - 3 = N(14)." },
            { topic: "Series", q: "Complete the series: A, C, F, J, ?", options: ["M", "N", "O", "P"], a: 2, exp: "The difference between letters increases: +2, +3, +4. The next is +5. J(10) + 5 = O(15)." },
            { topic: "Series", q: "Find the next number: 2, 5, 11, 23, 47, ?", options: ["95", "94", "96", "97"], a: 0, exp: "The pattern is (previous number × 2) + 1. So, (47 × 2) + 1 = 94 + 1 = 95." },

            // Blood Relations
            { topic: "Blood Relations", q: "Pointing to a photograph, a man said, 'I have no brother or sister but that man's father is my father's son.' Whose photograph was it?", options: ["His own", "His son's", "His father's", "His nephew's"], a: 1, exp: "'My father's son' is the man himself (since he has no siblings). So, 'that man's father' is the man speaking. Hence, the photograph is of his son." },
            { topic: "Blood Relations", q: "A is B's brother. C is D's father. E is B's mother. A and D are brothers. How is E related to C?", options: ["Sister", "Mother", "Wife", "Aunt"], a: 2, exp: "A, B, and D are siblings. E is their mother and C is their father. Therefore, E is the wife of C." },
            { topic: "Blood Relations", q: "A woman introduces a man as the son of the brother of her mother. How is the man related to the woman?", options: ["Nephew", "Son", "Cousin", "Uncle"], a: 2, exp: "Brother of her mother = Maternal Uncle. Son of Maternal Uncle = Cousin." },
            { topic: "Blood Relations", q: "X is the sister of Y. Y is the brother of Z. Z is the husband of P. O is the father of Y. How is P related to O?", options: ["Sister", "Daughter", "Niece", "Daughter-in-law"], a: 3, exp: "X, Y, Z are children of O. Z is married to P. Therefore, P is the wife of O's son, making her O's daughter-in-law." },
            { topic: "Blood Relations", q: "If A + B means A is father of B; A - B means A is brother of B; A % B means A is wife of B, then what does P + Q - R % S mean?", options: ["P is father-in-law of S", "P is uncle of S", "P is brother of S", "P is father of S"], a: 0, exp: "P is father of Q, Q is brother of R (so P is father of R). R is wife of S. Since P is R's father, P is the father-in-law of S." },

            // Direction & Distance
            { topic: "Direction & Distance", q: "A man walks 5 km South, then turns Right and walks 3 km, turns Left and walks 5 km. In which direction is he from the starting point?", options: ["South", "South-West", "West", "North-West"], a: 1, exp: "Starting from origin, he goes South, turns right (West), then left (South). His final position is South and West of the origin." },
            { topic: "Direction & Distance", q: "Rahul travelled 20 km towards East, then turned right and travelled 10 km. Again he turned right and travelled 20 km. How far is he from the starting point?", options: ["10 km", "20 km", "30 km", "0 km"], a: 0, exp: "He forms a rectangle. 20 East, 10 South, 20 West. He is exactly 10 km South of his starting point." },
            { topic: "Direction & Distance", q: "I am facing North. I turn 90 degrees clockwise, then 135 degrees anticlockwise. Which direction am I facing now?", options: ["East", "West", "North-West", "North-East"], a: 2, exp: "North + 90° CW = East. East - 135° CCW = North-West. Net turn = 45° CCW from North." },
            { topic: "Direction & Distance", q: "A starts from a point and walks 2km North, turns right and walks 2km, turns right again and walks 2km. Which direction is he facing now?", options: ["North", "South", "East", "West"], a: 1, exp: "Facing North -> right turn means facing East -> right turn means facing South." },
            { topic: "Direction & Distance", q: "Town D is towards the East of town F. Town B is towards the North of town D. Town H is towards the South of town B. Towards which direction is town H from town F?", options: ["East", "South-East", "North-East", "Data Inadequate"], a: 3, exp: "H is south of B, but we don't know the exact distance. H could be North of D, on D, or South of D. Thus, its direction relative to F cannot be determined." },

            // Syllogism
            { topic: "Syllogism", q: "Statements: All cars are cats. All fans are cats.<br>Conclusions: 1. All cars are fans. 2. Some fans are cars.", options: ["Only 1 follows", "Only 2 follows", "Both 1 and 2 follow", "Neither 1 nor 2 follows"], a: 3, exp: "Cars and fans are both subsets of cats, but there is no direct relation given between cars and fans. Neither conclusion is definite." },
            { topic: "Syllogism", q: "Statements: Some books are pens. No pen is pencil.<br>Conclusions: 1. Some books are pencils. 2. No book is pencil.", options: ["Only 1 follows", "Only 2 follows", "Either 1 or 2 follows", "Neither follows"], a: 2, exp: "The relationship between book and pencil is unknown. However, they are complementary pairs (Some/No), so Either 1 or 2 must be true." },
            { topic: "Syllogism", q: "Statements: All cups are books. All books are shirts.<br>Conclusions: 1. Some cups are not shirts. 2. Some shirts are cups.", options: ["Only 1 follows", "Only 2 follows", "Both follow", "Neither follows"], a: 1, exp: "Since all cups are books and all books are shirts, all cups are shirts. Conclusion 1 is false. Conclusion 2 is true (converse of 'all cups are shirts')." },
            { topic: "Syllogism", q: "Statements: Some dogs are bats. Some bats are cats.<br>Conclusions: 1. Some dogs are cats. 2. Some cats are dogs.", options: ["Only 1", "Only 2", "Both", "Neither"], a: 3, exp: "There is no direct link between dogs and cats in the statements. Both are possibilities, not definite conclusions." },
            { topic: "Syllogism", q: "If 'All A are B' and 'No B is C', which of the following is definitely true?", options: ["Some A are C", "No A is C", "All C are A", "Some C are B"], a: 1, exp: "If A is entirely inside B, and B has no overlap with C, then A cannot overlap with C. Therefore, No A is C is true." },

            // Venn Diagrams & Sequence
            { topic: "Venn Diagrams", q: "Which of the following describes the relationship between: Women, Mothers, Engineers?", options: ["Three disjoint circles", "Two concentric circles, one intersecting both", "One circle inside another, third intersects both", "Three intersecting circles"], a: 2, exp: "All mothers are women (Mothers circle inside Women circle). Engineers can be mothers, women, or men, so the Engineer circle intersects both." },
            { topic: "Logical Sequence", q: "Arrange logically: 1. Police 2. Punishment 3. Crime 4. Judge 5. Judgement", options: ["3, 1, 4, 5, 2", "3, 1, 2, 4, 5", "1, 3, 4, 5, 2", "3, 4, 5, 1, 2"], a: 0, exp: "First, a Crime (3) occurs, then Police (1) arrest, presented to a Judge (4), who gives a Judgement (5), leading to Punishment (2)." },
            { topic: "Logical Sequence", q: "Arrange logically: 1. Probation 2. Interview 3. Selection 4. Appointment 5. Advertisement", options: ["5, 2, 3, 4, 1", "5, 3, 2, 1, 4", "5, 4, 2, 3, 1", "5, 2, 4, 3, 1"], a: 0, exp: "Advertisement (5) is released, followed by Interview (2), Selection (3), Appointment (4), and finally Probation period (1)." },
            { topic: "Ranking & Order", q: "In a row of boys, A is 10th from the left and B is 9th from the right. If they interchange positions, A becomes 15th from the left. How many boys are there in the row?", options: ["23", "27", "28", "31"], a: 0, exp: "A's new position is 15th from left. This is B's old position, which was 9th from right. Total = (Left + Right) - 1 = (15 + 9) - 1 = 23." },
            { topic: "Calendar", q: "If the 3rd of a month is Tuesday, what date will be 3 days after the 21st of the month?", options: ["22nd", "23rd", "24th", "25th"], a: 2, exp: "3 days after 21st is the 24th. (Note: Dates falling on 3, 10, 17, 24 are the same weekday, so the 24th is a Tuesday)." },

            // Missing Number & Math Operations
            { topic: "Series/Math", q: "4, 16, 64, 256, ?", options: ["1024", "512", "128", "2048"], a: 0, exp: "Each number is multiplied by 4. 256 × 4 = 1024." },
            { topic: "Math Operations", q: "If 12 x 16 = 188 and 14 x 18 = 248, then 16 x 20 = ?", options: ["316", "320", "312", "300"], a: 0, exp: "Logic: Multiply and subtract 4. (12×16)=192-4=188. (14×18)=252-4=248. (16×20)=320-4=316." },
            { topic: "Math Operations", q: "If 5 * 3 = 16 and 7 * 2 = 18, then 9 * 4 = ?", options: ["24", "26", "28", "32"], a: 1, exp: "Logic: (First + Second) × 2. (5+3)×2=16. (7+2)×2=18. (9+4)×2=26." },
            { topic: "Arithmetic Reasoning", q: "The sum of ages of 5 children born at intervals of 3 years each is 50. What is the age of the youngest child?", options: ["4", "5", "6", "8"], a: 0, exp: "Let youngest be x. Sum: x + (x+3) + (x+6) + (x+9) + (x+12) = 50. 5x + 30 = 50 => 5x = 20 => x = 4." },
            { topic: "Arithmetic Reasoning", q: "A tailor had a number of shirt pieces to cut from a roll of fabric. He cut each roll of equal length into 10 pieces. He cut at the rate of 45 cuts a minute. How many rolls would be cut in 24 minutes?", options: ["120", "108", "144", "160"], a: 0, exp: "To cut a roll into 10 pieces, 9 cuts are required. In 1 min, he makes 45 cuts (5 rolls). In 24 mins, he cuts 24 × 5 = 120 rolls." },

            // Miscellaneous
            { topic: "Word Formation", q: "Select the word which CANNOT be formed using the letters of 'COMPANIONSHIP'.", options: ["OPEN", "OPIUM", "OPINION", "NATION"], a: 1, exp: "The word OPIUM cannot be formed because there is no 'U' in COMPANIONSHIP." },
            { topic: "Clock", q: "How many times are the hands of a clock at right angles in a day?", options: ["22", "24", "44", "48"], a: 2, exp: "In 12 hours, they are at right angles 22 times. So, in 24 hours, it's 22 × 2 = 44 times." },
            { topic: "Calendar", q: "What was the day of the week on 15th August 1947?", options: ["Thursday", "Friday", "Saturday", "Sunday"], a: 1, exp: "By calculating odd days: 1946 years + Jan to Aug 15. The total odd days amount to 5, which represents Friday." },
            { topic: "Dice", q: "A standard dice has numbers 1 to 6. Which number is always opposite to 3?", options: ["1", "2", "4", "5"], a: 2, exp: "In a standard dice, the sum of opposite faces is always 7. Therefore, 7 - 3 = 4." },
            { topic: "Figure Counting", q: "How many triangles are there in a square with both diagonals drawn?", options: ["4", "6", "8", "10"], a: 2, exp: "There are 4 small distinct triangles, and 4 larger triangles composed of two small ones each. Total = 8." },

            { topic: "Analogy", q: "Cataract : Eye :: Pneumonia : ?", options: ["Brain", "Ear", "Lungs", "Heart"], a: 2, exp: "Cataract is a disease of the eye, while Pneumonia affects the lungs." },
            { topic: "Classification", q: "Find the odd word:", options: ["Square", "Sphere", "Rectangle", "Circle"], a: 1, exp: "Sphere is a 3-dimensional shape, whereas the others are 2-dimensional geometric figures." },
            { topic: "Coding", q: "If DELHI is coded as 73541 and CALCUTTA as 82589662, how can CALICUT be coded?", options: ["5279431", "5978213", "8251896", "8543691"], a: 2, exp: "Direct letter coding. C=8, A=2, L=5, I=1, C=8, U=9, T=6. Result: 8251896." },
            { topic: "Series", q: "Find the missing term: 1, 1, 2, 6, 24, ?, 720", options: ["100", "120", "144", "104"], a: 1, exp: "Factorial pattern or multiply by consecutive integers: 1×1=1, 1×2=2, 2×3=6, 6×4=24, 24×5=120." },
            { topic: "Blood Relations", q: "Pointing to a lady, a girl said, 'She is the daughter-in-law of the grandmother of my father's only son.' How is the lady related to the girl?", options: ["Mother", "Aunt", "Sister", "Cousin"], a: 0, exp: "Father's only son = Girl's brother. Grandmother of brother = Girl's grandmother. Daughter-in-law of grandmother (assuming single family) = Mother or Aunt. Given options and typical reasoning constraints, 'Mother' is the primary relation." },

            { topic: "Direction", q: "A girl faces North. She turns 180 degrees, then 90 degrees in the same direction, and then 45 degrees in the opposite direction. Which direction is she facing now?", options: ["South-West", "North-East", "North-West", "South-East"], a: 0, exp: "North -> 180° = South. +90° = West (assuming CW for 'same direction'). -45° CCW = South-West." },
            { topic: "Syllogism", q: "Statements: All bags are cakes. All lamps are cakes. No lamp is a bag.<br>Conclusion: Some cakes are lamps.", options: ["True", "False", "Cannot Say", "Incomplete Data"], a: 0, exp: "Since 'All lamps are cakes', it directly implies that 'Some cakes are lamps'." },
            { topic: "Sequence", q: "Arrange: 1. Seed 2. Plant 3. Fruit 4. Food 5. Flower", options: ["1, 2, 5, 3, 4", "1, 5, 2, 3, 4", "2, 1, 5, 3, 4", "1, 2, 3, 5, 4"], a: 0, exp: "Logical growth process: Seed (1) grows into Plant (2), bears Flower (5), produces Fruit (3), consumed as Food (4)." },
            { topic: "Math Operations", q: "Which interchange of signs makes the equation correct: 5 + 3 × 8 - 12 ÷ 4 = 3?", options: ["+ and -", "- and ÷", "+ and ×", "× and -"], a: 1, exp: "If we swap - and ÷: 5 + 3 × 8 ÷ 12 - 4. BODMAS: 3 × (8/12) = 2. Then 5 + 2 - 4 = 3. Correct!" },
            { topic: "Clock", q: "The angle between the minute hand and the hour hand of a clock when the time is 8:30 is:", options: ["80 Degrees", "75 Degrees", "60 Degrees", "105 Degrees"], a: 1, exp: "Formula: |30H - 5.5M| = |30(8) - 5.5(30)| = |240 - 165| = 75 degrees." }
        ];

        let currentIdx = 0;
        let score = 0;
        let answered = false;

        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const qCounter = document.getElementById('q-current');
        const nextBtn = document.getElementById('next-btn');
        const feedbackArea = document.getElementById('feedback-area');
        const progressBar = document.getElementById('progress-bar');
        const scoreDisplay = document.getElementById('score-display');
        const topicBadge = document.getElementById('topic-badge');

        function renderQuestion() {
            // Reset state
            answered = false;
            nextBtn.classList.add('hidden');
            feedbackArea.classList.add('hidden');
            feedbackArea.innerHTML = '';
            
            // Re-trigger animation
            const quizArea = document.getElementById('quiz-area');
            quizArea.classList.remove('slide-in');
            void quizArea.offsetWidth; // Trigger reflow
            quizArea.classList.add('slide-in');

            const currentQ = reasoningData[currentIdx];
            
            // Populate text
            topicBadge.innerText = currentQ.topic;
            qText.innerHTML = currentQ.q;
            qCounter.innerText = currentIdx + 1;
            
            // Update Progress
            const progressPct = ((currentIdx) / reasoningData.length) * 100;
            progressBar.style.width = `${progressPct}%`;

            optionsContainer.innerHTML = '';
            currentQ.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-4 rounded-xl border border-slate-700 bg-slate-800/60 text-left font-medium text-slate-200 flex items-center gap-4 group";
                btn.innerHTML = `
                    <span class="w-8 h-8 rounded-md bg-slate-700 text-slate-300 flex items-center justify-center font-bold text-sm shrink-0 group-hover:bg-blue-500 group-hover:text-white transition-colors">
                        ${String.fromCharCode(65 + index)}
                    </span>
                    <span class="text-base sm:text-lg">${opt}</span>
                `;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, btnElement) {
            if (answered) return;
            answered = true;

            const currentQ = reasoningData[currentIdx];
            const correctIndex = currentQ.a;
            const allButtons = optionsContainer.querySelectorAll('button');

            // Disable all buttons
            allButtons.forEach((btn, i) => {
                btn.classList.add('disabled', 'cursor-not-allowed', 'opacity-60');
                btn.classList.remove('group-hover:bg-blue-500');
                
                // Highlight correct answer
                if (i === correctIndex) {
                    btn.classList.add('correct-opt', 'opacity-100');
                    btn.classList.remove('opacity-60', 'border-slate-700');
                    btn.querySelector('span:first-child').classList.add('bg-emerald-500', 'text-white');
                    btn.querySelector('span:first-child').classList.remove('bg-slate-700', 'text-slate-300');
                }
            });

            feedbackArea.classList.remove('hidden');

            if (selectedIndex === correctIndex) {
                score++;
                scoreDisplay.innerText = score;
                feedbackArea.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
                feedbackArea.classList.remove('bg-rose-500/10', 'text-rose-400', 'border-rose-500/20');
                feedbackArea.innerHTML = `<strong class="block mb-1">Excellent!</strong> ${currentQ.exp}`;
            } else {
                // Highlight wrong selection
                btnElement.classList.remove('opacity-60');
                btnElement.classList.add('wrong-opt', 'opacity-100');
                btnElement.querySelector('span:first-child').classList.add('bg-rose-500', 'text-white');
                btnElement.querySelector('span:first-child').classList.remove('bg-slate-700');

                feedbackArea.classList.add('bg-rose-500/10', 'text-rose-400', 'border', 'border-rose-500/20');
                feedbackArea.classList.remove('bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20');
                feedbackArea.innerHTML = `<strong class="block mb-1">Incorrect.</strong> ${currentQ.exp}`;
            }

            nextBtn.classList.remove('hidden');
            if (currentIdx === reasoningData.length - 1) {
                nextBtn.innerHTML = "View Results <span class='ml-2'>🏆</span>";
            }
        }

        nextBtn.onclick = () => {
            if (currentIdx < reasoningData.length - 1) {
                currentIdx++;
                renderQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            progressBar.style.width = `100%`;
            document.getElementById('quiz-area').classList.add('hidden');
            document.querySelector('header').classList.add('hidden');
            document.getElementById('next-btn').parentElement.classList.add('hidden');
            
            const resultArea = document.getElementById('result-area');
            resultArea.classList.remove('hidden');
            resultArea.classList.add('flex');
            
            const accuracy = Math.round((score / reasoningData.length) * 100);
            
            // Simple counter animation
            let currentAcc = 0;
            const interval = setInterval(() => {
                if (currentAcc >= accuracy) {
                    clearInterval(interval);
                    document.getElementById('final-accuracy').innerText = `${accuracy}%`;
                } else {
                    currentAcc += 2;
                    document.getElementById('final-accuracy').innerText = `${currentAcc}%`;
                }
            }, 30);

            document.getElementById('final-score').innerText = score;
        }

        // Boot up
        window.onload = renderQuestion;
    </script>
</body>
</html>
