<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC CGL Coding-Decoding Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Teal/Cyan Theme for Coding-Decoding */
            --bg-color: #f0fdfa;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #4b5563;
            --primary: #0d9488;
            --primary-hover: #0f766e;
            --correct: #059669;
            --incorrect: #dc2626;
            --border: #e5e7eb;
            --exp-bg: #ccfbf1;
            --exp-text: #115e59;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            max-width: 750px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(13, 148, 136, 0.1);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background-color: var(--border);
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Question */
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* Options */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 15px 20px;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .option:hover:not(.disabled) {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .option.disabled {
            cursor: not-allowed;
        }

        .option.correct {
            background: #d1fae5;
            border-color: var(--correct);
            color: #065f46;
        }

        .option.incorrect {
            background: #fee2e2;
            border-color: var(--incorrect);
            color: #991b1b;
        }

        /* Explanation Box */
        .explanation-box {
            background: var(--exp-bg);
            border-left: 4px solid var(--primary);
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 25px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .explanation-box.show {
            display: block;
        }

        .explanation-title {
            font-weight: 700;
            color: var(--exp-text);
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .explanation-text {
            color: var(--exp-text);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Controls */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
            display: none;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        /* Results Screen */
        .results-screen {
            text-align: center;
            display: none;
        }

        .results-screen.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--exp-bg);
            border: 6px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin: 0 auto 20px;
        }

        .results-message {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .results-subtext {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Quiz Screen -->
        <div id="quiz-screen">
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            
            <div class="header">
                <span id="question-tracker">Question 1 of 50</span>
                <span id="score-tracker">Score: 0</span>
            </div>

            <div class="question-text" id="question-text">
                Loading question...
            </div>

            <div class="options-grid" id="options-grid">
                <!-- Options injected via JS -->
            </div>

            <div class="explanation-box" id="explanation-box">
                <div class="explanation-title">Logic / Pattern:</div>
                <div class="explanation-text" id="explanation-text"></div>
            </div>

            <button class="btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
        </div>

        <!-- Results Screen -->
        <div class="results-screen" id="results-screen">
            <div class="score-circle" id="final-score">0/50</div>
            <div class="results-message" id="results-message">Great effort!</div>
            <div class="results-subtext" id="results-subtext">You have completed the Coding-Decoding Quiz.</div>
            <button class="btn show" onclick="restartQuiz()">Restart Quiz</button>
        </div>
    </div>

    <script>
        // 50 SSC CGL Level Coding-Decoding Questions
        const rawQuestions = [
            { q: "If in a certain code, 'ROAR' is written as 'URDU', how is 'URDU' written in that code?", options: ["VXGX", "XUGX", "ROAR", "VXDQ"], a: "XUGX", exp: "Pattern: Each letter is shifted forward by 3 places. R(+3)=U, O(+3)=R, A(+3)=D, R(+3)=U. So, U(+3)=X, R(+3)=U, D(+3)=G, U(+3)=X." },
            { q: "If 'WATER' is coded as 'YCVGT', then what is the code for 'HKTG'?", options: ["FIRE", "FEAR", "FOUR", "FAIR"], a: "FIRE", exp: "Pattern: +2 shift. W(+2)=Y, A(+2)=C... The word 'HKTG' is already coded, we need the original. So -2 shift: H(-2)=F, K(-2)=I, T(-2)=R, G(-2)=E." },
            { q: "If 'DELHI' is coded as 'CCIDD', how would you encode 'BOMBAY'?", options: ["AJMTVT", "AMJXVS", "MJXVSU", "WXYZAX"], a: "AMJXVS", exp: "Pattern: -1, -2, -3, -4, -5. D(-1)=C, E(-2)=C, L(-3)=I, H(-4)=D, I(-5)=D. So, B(-1)=A, O(-2)=M, M(-3)=J, B(-4)=X, A(-5)=V, Y(-6)=S." },
            { q: "If A=1, BAT=23, then what is the value of 'CAT'?", options: ["24", "25", "22", "26"], a: "24", exp: "Pattern: Sum of alphabetical positions. B(2)+A(1)+T(20) = 23. So, C(3)+A(1)+T(20) = 24." },
            { q: "If Z=52 and ACT=48, then what will 'BAT' be equal to?", options: ["39", "41", "44", "46"], a: "46", exp: "Pattern: Sum of positions multiplied by 2. Z=26x2=52. ACT=(1+3+20)x2=48. So, BAT=(2+1+20)x2 = 23x2 = 46." },
            { q: "If 'GO' is coded as 32, and 'SHE' is coded as 49, then 'SOME' will be equal to:", options: ["56", "58", "62", "64"], a: "56", exp: "Pattern: Sum of reverse alphabetical positions (A=26, B=25...). G(20)+O(12)=32. S(8)+H(19)+E(22)=49. SOME = S(8)+O(12)+M(14)+E(22) = 56." },
            { q: "If 'E' = 5 and 'PEN' = 35, then how will 'PAGE' be coded?", options: ["27", "28", "29", "36"], a: "29", exp: "Pattern: Sum of alphabet positions. P(16)+E(5)+N(14) = 35. PAGE = P(16)+A(1)+G(7)+E(5) = 29." },
            { q: "If 'PAINT' is coded as 74128 and 'EXCEL' is coded as 93596, then how will 'ACCEPT' be coded?", options: ["455978", "544978", "455378", "733968"], a: "455978", exp: "Pattern: Direct substitution. A=4, C=5, C=5, E=9, P=7, T=8." },
            { q: "If in a certain language 'KASHMIR' is written as '8142753', how is 'RIMSHAK' written in that language?", options: ["3574218", "3574281", "3574812", "3574182"], a: "3574218", exp: "Pattern: Direct substitution of letters. R=3, I=5, M=7, S=4, H=2, A=1, K=8." },
            { q: "If 'MIND' becomes 'KGLB' and 'ARGUE' becomes 'YPESC', then what will 'DIAGRAM' be in that code?", options: ["BGYEPYK", "BGYPYEK", "GLPEYKB", "LKBGYPK"], a: "BGYEPYK", exp: "Pattern: -2 shift for all letters. M(-2)=K, I(-2)=G, etc. D(-2)=B, I(-2)=G, A(-2)=Y, G(-2)=E, R(-2)=P, A(-2)=Y, M(-2)=K." },
            { q: "If 'SPIDER' is written as 'PSDIRE' in a certain code, how would 'COMMON' be written in that code?", options: ["OCMMNO", "OCOMO", "OCOMMO", "OCMOMN"], a: "OCMMNO", exp: "Pattern: Letters are swapped in pairs. (SP->PS), (ID->DI), (ER->RE). So (CO->OC), (MM->MM), (ON->NO) = OCMMNO." },
            { q: "If 'MACHINE' is coded as 19-7-9-14-15-20-11, how will you code 'DANGER'?", options: ["10-7-20-13-11-24", "11-7-20-16-11-24", "13-7-20-9-11-25", "10-7-20-16-11-24"], a: "10-7-20-13-11-24", exp: "Pattern: Alphabet position + 6. M(13)+6=19, A(1)+6=7... D(4)+6=10, A(1)+6=7, N(14)+6=20, G(7)+6=13, E(5)+6=11, R(18)+6=24." },
            { q: "If 'GLARE' is coded as 67810 and 'MONSOON' as 2395339, how is 'RANSOM' coded?", options: ["189532", "189352", "198532", "183952"], a: "189532", exp: "Pattern: Direct substitution. R=1, A=8, N=9, S=5, O=3, M=2. Therefore, RANSOM = 189532." },
            { q: "If 'ROSE' is coded as 6821, 'CHAIR' is coded as 73456 and 'PREACH' is coded as 961473, what will be the code for 'SEARCH'?", options: ["214673", "214763", "216473", "214637"], a: "214673", exp: "Pattern: Direct letter-to-number mapping. S=2, E=1, A=4, R=6, C=7, H=3." },
            { q: "In a certain code language, 'COLD' is written as 'DPME'. How is 'IRON' written in that code?", options: ["J SPO", "J SQO", "JSPO", "JSOO"], a: "JSPO", exp: "Pattern: +1 shift. C(+1)=D, O(+1)=P, L(+1)=M, D(+1)=E. I(+1)=J, R(+1)=S, O(+1)=P, N(+1)=O." },
            { q: "If in a certain code 'TEACHER' is written as 'VGCEJGT', how is 'CHILDREN' written?", options: ["EJKNFGTP", "EJKNFHTG", "EJKNFGTH", "EJKNFTGG"], a: "EJKNFGTP", exp: "Pattern: +2 shift for all letters. T(+2)=V, E(+2)=G... C(+2)=E, H(+2)=J, I(+2)=K, L(+2)=N, D(+2)=F, R(+2)=T, E(+2)=G, N(+2)=P." },
            { q: "If 'FISH' is written as 'EHRG' in a certain code, how would 'JUNGLE' be written?", options: ["ITMFKD", "ITMFKE", "KVOHMF", "KVOHMD"], a: "ITMFKD", exp: "Pattern: -1 shift for all letters. F(-1)=E, I(-1)=H, S(-1)=R, H(-1)=G. J(-1)=I, U(-1)=T, N(-1)=M, G(-1)=F, L(-1)=K, E(-1)=D." },
            { q: "If 'SYSTEM' is coded as 'SYSMET' and 'NEARER' as 'AENRER', how is 'FRACTION' coded?", options: ["CARFNOIT", "CARFNOJI", "FRACTNOI", "ARFCNOIT"], a: "CARFNOIT", exp: "Pattern: Word is split in half, and each half is reversed. FRAC-TION -> CARF-NOIT." },
            { q: "If 'GIVE' is coded as 5137 and 'BAT' is coded as 924, how is 'GATE' coded?", options: ["5427", "5247", "5847", "5237"], a: "5247", exp: "Pattern: Direct substitution. G=5, I=1, V=3, E=7, B=9, A=2, T=4. So, GATE = 5-2-4-7." },
            { q: "If 'BOMBAY' is written as 'MYMYMY', how will 'TAMILNADU' be written in that code?", options: ["TIATIATIA", "MNUMNUMNU", "ALUALUALU", "IATIATIAT"], a: "MNUMNUMNU", exp: "Pattern: The 3rd and 6th letters (M, Y) are repeated. For TAMILNADU (9 letters), the 3rd, 6th, and 9th letters are M, N, U. Repeat them: MNUMNUMNU." },
            { q: "If 'OVEN' is coded as 'PWFO', how will 'STOVE' be coded?", options: ["TUPWF", "TUQWF", "TUPWE", "TVPWF"], a: "TUPWF", exp: "Pattern: +1 shift. O(+1)=P, V(+1)=W, E(+1)=F, N(+1)=O. S(+1)=T, T(+1)=U, O(+1)=P, V(+1)=W, E(+1)=F." },
            { q: "If 'PALE' is coded as 2134, 'EARTH' is coded as 41590, how is 'PEARL' coded?", options: ["29530", "24153", "25413", "25430"], a: "24153", exp: "Pattern: Direct letter-to-number assignment. P=2, E=4, A=1, R=5, L=3. PEARL = 24153." },
            { q: "If in a code language, 'COBRA' is written as 3152181, how will 'GORILLA' be written?", options: ["71518912121", "71418912121", "71518911121", "71518812121"], a: "71518912121", exp: "Pattern: Direct position values of alphabets. C=3, O=15, B=2, R=18, A=1. G=7, O=15, R=18, I=9, L=12, L=12, A=1." },
            { q: "If 'CEZQ' is coded as 'XVAJ', then 'MUBD' will be coded as:", options: ["NFYW", "NEXW", "NFXW", "NFYX"], a: "NFYW", exp: "Pattern: Opposite letters (A<->Z, B<->Y). C<->X, E<->V, Z<->A, Q<->J. M<->N, U<->F, B<->Y, D<->W = NFYW." },
            { q: "If 1 stands for A, 2 for B, 3 for C and so on, what does '8 5 12 16' stand for?", options: ["HELP", "HEAL", "HEAD", "HEAR"], a: "HELP", exp: "Pattern: Direct numerical value. 8=H, 5=E, 12=L, 16=P." },
            { q: "If 'RED' is coded as 6720, then how would 'GREEN' be coded?", options: ["1677209", "1677199", "16717209", "9207716"], a: "1677209", exp: "Pattern: Alphabet position + 2, written in reverse order. R(18+2=20), E(5+2=7), D(4+2=6). Reverse: 6-7-20. GREEN -> 16-7-7-20-9." },
            { q: "If 'NOBLE' is coded as 'OPCMF', how will 'PLATE' be coded?", options: ["QMBUF", "QMBVF", "QMCUF", "QNCUF"], a: "QMBUF", exp: "Pattern: +1 shift for all letters. P(+1)=Q, L(+1)=M, A(+1)=B, T(+1)=U, E(+1)=F." },
            { q: "If 'ORAL' is coded as 3196, then 'WRITTEN' is coded as:", options: ["5992255", "5522995", "5922955", "5929255"], a: "5522995", exp: "Pattern: Sum of digits of the alphabetical position. Reverse it. W(23->5), R(18->9), I(9), T(20->2), T(20->2), E(5), N(14->5). Reverse: 5522995." },
            { q: "If 'CLOUD' is written as 'DPMVE', how is 'SIGHT' written?", options: ["TJHIU", "TJIHU", "UJIHU", "THJIU"], a: "TJHIU", exp: "Pattern: +1 shift for all letters. S(+1)=T, I(+1)=J, G(+1)=H, H(+1)=I, T(+1)=U." },
            { q: "If 'MONKEY' is coded as 'XDJMNL', how is 'TIGER' coded?", options: ["QDFHS", "SDFHS", "SHFDQ", "UJHFS"], a: "QDFHS", exp: "Pattern: Reverse the word and then -1 shift. MONKEY reversed is YEKNOM -> XDJMNL. TIGER reversed is REGIT -> QDFHS." },
            { q: "In a certain code, 'COMPUTER' is written as 'RFUVQNPC'. How is 'MEDICINE' written in that code?", options: ["EOJDJEFM", "EOJDEJFM", "MFEJDJOE", "MFEDJJOE"], a: "EOJDJEFM", exp: "Pattern: Reverse the word, then middle letters +1. MEDICINE reversed: ENICIDEM -> E(+0), N(+1)=O, I(+1)=J, C(+1)=D, I(+1)=J, D(+1)=E, E(+1)=F, M(+0)=M." },
            { q: "If 'CUP' is coded as 40, then 'KITE' will be coded as:", options: ["45", "54", "40", "43"], a: "45", exp: "Pattern: Sum of position values. C(3) + U(21) + P(16) = 40. K(11) + I(9) + T(20) + E(5) = 45." },
            { q: "If 'BAG' = 71, then 'VICE' = ?", options: ["69", "70", "71", "72"], a: "69", exp: "Pattern: Sum of reverse alphabet values. B(25) + A(26) + G(20) = 71. V(5) + I(18) + C(24) + E(22) = 69." },
            { q: "In a code, 'PENCIL' is 59, 'ERASER' is 66. What is 'SCALE'?", options: ["40", "42", "45", "48"], a: "40", exp: "Pattern: Sum of direct values. S(19)+C(3)+A(1)+L(12)+E(5) = 40." },
            { q: "If 'PAPER' is written as 'QCSIW', how will 'BOARD' be written?", options: ["CQDVI", "CPDVI", "CQEVI", "DQFVI"], a: "CQDVI", exp: "Pattern: +1, +2, +3, +4, +5. B(+1)=C, O(+2)=Q, A(+3)=D, R(+4)=V, D(+5)=I." },
            { q: "If 'APPLE' is 25 and 'MANGO' is 25, then 'BANANA' is:", options: ["30", "36", "25", "42"], a: "36", exp: "Pattern: (Number of letters)^2. BANANA (6 letters) = 6^2 = 36." },
            { q: "In a certain code, 'CLOCK' is 'KCOLC'. How is 'STEPS' coded?", options: ["SPETS", "SPTES", "SPEST", "SPSET"], a: "SPETS", exp: "Pattern: Word is reversed. CLOCK -> KCOLC. STEPS -> SPETS." },
            { q: "If 'WORK' is coded as 4-12-9-16, then how will 'DONE' be coded?", options: ["23-12-13-22", "23-13-12-22", "22-12-13-23", "23-12-14-22"], a: "23-12-13-22", exp: "Pattern: Numerical position of the opposite letter (Reverse value). D->W(23), O->L(12), N->M(13), E->V(22)." },
            { q: "If 'LEADER' is coded as 20-13-9-12-13-26, how is 'LIGHT' written?", options: ["20-17-15-16-28", "20-16-15-17-28", "20-15-16-17-28", "20-17-15-18-28"], a: "20-17-15-16-28", exp: "Pattern: Position value + 8. L(12)+8=20, I(9)+8=17, G(7)+8=15, H(8)+8=16, T(20)+8=28." },
            { q: "If 'TOMB' is coded as 'MBTO', then 'GOAL' is coded as:", options: ["ALGO", "LAOG", "ALTO", "LOGA"], a: "ALGO", exp: "Pattern: The word is divided into two halves, and the second half is placed before the first half." },
            { q: "If 'BLACK' is written as 'KCALB', how will 'WHITE' be written?", options: ["VHJUF", "FJUHV", "ETIHW", "FUIHW"], a: "ETIHW", exp: "Pattern: Reverse the word. WHITE -> ETIHW." },
            { q: "If 'RAT' = 39 and 'CHAT' = 32, then 'TWITTER' = ?", options: ["111", "112", "114", "115"], a: "115", exp: "Pattern: Sum of positions. T(20)+W(23)+I(9)+T(20)+T(20)+E(5)+R(18) = 115." },
            { q: "If in a certain language 'NEVER' is written as 'REVEN', how is 'ALWAYS' written?", options: ["SYAWLA", "SYAALW", "SYAWAL", "SYWALA"], a: "SYAWLA", exp: "Pattern: Complete reversal of letters. NEVER -> REVEN. ALWAYS -> SYAWLA." },
            { q: "If 'DOG' is coded as 'WLT', how is 'CAT' coded?", options: ["XZG", "XZH", "YZG", "XZF"], a: "XZG", exp: "Pattern: Opposite letters. C<->X, A<->Z, T<->G." },
            { q: "If 'DEER' is coded as 12215 and 'HIGH' is coded as 5645, how is 'HEEL' coded?", options: ["5229", "5228", "5227", "5230"], a: "5229", exp: "Pattern: Position value - 3. H(8)-3=5, E(5)-3=2, E(5)-3=2, L(12)-3=9 (5229)." },
            { q: "In a certain code, 'MIND' is '139144'. How is 'FACT' written?", options: ["61320", "61420", "62420", "61319"], a: "61320", exp: "Pattern: Direct concatenation of alphabet numbers. F=6, A=1, C=3, T=20 -> 61320." },
            { q: "If 'BROTHER' is coded as 2456784, 'SISTER' as 919684, then 'ROBBERS' is:", options: ["4522849", "4522841", "4522839", "4522848"], a: "4522849", exp: "Pattern: Direct substitution. R(4) O(5) B(2) B(2) E(8) R(4) S(9) -> 4522849." },
            { q: "If 'LATE' is coded as 38, 'MAKE' is coded as 30, then 'HATE' is coded as:", options: ["34", "32", "30", "36"], a: "34", exp: "Pattern: Sum of letter positions. H(8)+A(1)+T(20)+E(5)=34." },
            { q: "If 'NATION' is coded as 'ANITNO', then 'HUNGRY' is coded as:", options: ["UHGNRY", "UHGNTR", "UHGNYR", "UHNGYR"], a: "UHGNYR", exp: "Pattern: Swap letters in pairs. HU-NG-RY -> UH-GN-YR." },
            { q: "If 'GOLD' is coded as 'IQNF', then 'CORD' is coded as:", options: ["EQTF", "EPSF", "EQSF", "EPTF"], a: "EQTF", exp: "Pattern: +2 shift. C(+2)=E, O(+2)=Q, R(+2)=T, D(+2)=F." },
            { q: "If 'SMART' is coded as 'UKCPV', how will 'WONDER' be coded?", options: ["YQPFGT", "YQPEGT", "YPQTFG", "YQPGFT"], a: "YQPFGT", exp: "Pattern: +2 shift. W(+2)=Y, O(+2)=Q, N(+2)=P, D(+2)=F, E(+2)=G, R(+2)=T." },
            { q: "In a code, 'BRAIN' is written as '*%#$@' and 'TIER' is written as '$#+%', how is 'RENT' written?", options: ["%+@$", "%+@#", "%+$@", "%#+$"], a: "%+@$", exp: "Pattern: Direct symbol substitution. R=%, E=+, N=@, T=$." },
            { q: "If 'BEAUTY' is coded as 'YVZFGB', how is 'CHARM' coded?", options: ["XSIZN", "XSHZN", "XSJZN", "XSIZQ"], a: "XSIZN", exp: "Pattern: Opposite letters. C-X, H-S, A-Z, R-I, M-N = XSIZN." },
            { q: "If 'FLOWER' is coded as 36, 'SUNFLOWER' is coded as 81, then 'ROSE' is coded as:", options: ["16", "20", "25", "24"], a: "16", exp: "Pattern: (Number of letters)^2. ROSE (4) = 16." },
            { q: "If 'A' = 2, 'B' = 4, 'C' = 6, then what is 'CAT'?", options: ["48", "44", "46", "50"], a: "48", exp: "Pattern: Alphabet position multiplied by 2. C(3x2=6) + A(1x2=2) + T(20x2=40) = 48." },
            { q: "If 'DELHI' is 73541 and 'CALCUTTA' is 82589662, how is 'CALICUT' coded?", options: ["8251896", "8251897", "8251898", "8251899"], a: "8251896", exp: "Pattern: Direct substitution. C=8, A=2, L=5, I=1, C=8, U=9, T=6." },
            { q: "If 'SNAKE' is coded as 'VQDNH', how is 'CRANE' coded?", options: ["FUDQH", "FUCQH", "FVDQH", "FVEQH"], a: "FUDQH", exp: "Pattern: +3 shift. C(+3)=F, R(+3)=U, A(+3)=D, N(+3)=Q, E(+3)=H." },
            { q: "If 'GIRL' is coded as 'HJSM', what is the code for 'BOY'?", options: ["CPZ", "CPX", "DPZ", "CQZ"], a: "CPZ", exp: "Pattern: +1 shift. B->C, O->P, Y->Z." },
            { q: "If 'TIGER' is coded as 'REGIT', how is 'PANDA' coded?", options: ["ADNAP", "ANDAP", "DAPAN", "NADAP"], a: "ADNAP", exp: "Pattern: Reverse the word. PANDA -> ADNAP." },
            { q: "If 'ZEBRA' is 2652181, then 'COBRA' is:", options: ["3152181", "3142181", "3152171", "3152182"], a: "3152181", exp: "Pattern: Direct alphabetical positions. C(3), O(15), B(2), R(18), A(1)." },
            { q: "If 'HONESTY' is 'ABCXZDQ', how is 'TONY' coded?", options: ["DBCQ", "DBCZ", "DCBQ", "DBQC"], a: "DBCQ", exp: "Pattern: Direct substitution from the given word. T=D, O=B, N=C, Y=Q." },
            { q: "If 'MOBILE' is 'NQEKPJ', how is 'PHONE' coded?", options: ["QJRRJ", "QJRPJ", "QJRQJ", "QJRQK"], a: "QJRRJ", exp: "Pattern: +1, +2, +3, +4, +5, +6. P(+1)=Q, H(+2)=J, O(+3)=R, N(+4)=R, E(+5)=J." },
            { q: "If 'BAT' is 23 and 'CAT' is 24, then 'BALL' is:", options: ["27", "28", "29", "30"], a: "27", exp: "Pattern: Sum of values. B(2)+A(1)+L(12)+L(12) = 27." },
            { q: "If 'GO' is 32, 'SHE' is 49, then 'THE' is:", options: ["48", "49", "50", "51"], a: "48", exp: "Pattern: Sum of reverse alphabetical positions. T(7) + H(19) + E(22) = 48." },
            { q: "If 'E' = 5 and 'HOTEL' = 12, how is 'LAMB' coded?", options: ["7", "10", "26", "28"], a: "7", exp: "Pattern: (Sum of positions) / (Number of letters). LAMB = (12+1+13+2)/4 = 28/4 = 7." }
        ];

        let quizData = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        // Fisher-Yates Shuffle
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function initQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            // Limit to exactly 50
            quizData = shuffleArray(rawQuestions).slice(0, 50);
            
            document.getElementById('results-screen').classList.remove('show');
            document.getElementById('quiz-screen').style.display = 'block';
            
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            const currentQ = quizData[currentQuestionIndex];
            
            document.getElementById('question-tracker').innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            document.getElementById('score-tracker').innerText = `Score: ${score}`;
            
            const progressPercent = ((currentQuestionIndex) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            document.getElementById('question-text').innerText = currentQ.q;

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = ''; 
            
            const shuffledOptions = shuffleArray(currentQ.options);
            
            shuffledOptions.forEach(opt => {
                const button = document.createElement('button');
                button.className = 'option';
                button.innerText = opt;
                button.onclick = () => selectOption(button, opt, currentQ.a, currentQ.exp);
                optionsGrid.appendChild(button);
            });

            document.getElementById('explanation-box').classList.remove('show');
            document.getElementById('next-btn').classList.remove('show');
        }

        function selectOption(selectedBtn, selectedText, correctText, explanation) {
            if (answered) return; 
            answered = true;

            const allOptions = document.querySelectorAll('.option');
            
            if (selectedText === correctText) {
                selectedBtn.classList.add('correct');
                score++;
                document.getElementById('score-tracker').innerText = `Score: ${score}`;
            } else {
                selectedBtn.classList.add('incorrect');
                allOptions.forEach(btn => {
                    if (btn.innerText === correctText) {
                        btn.classList.add('correct');
                    }
                });
            }

            allOptions.forEach(btn => btn.classList.add('disabled'));

            document.getElementById('explanation-text').innerText = explanation;
            document.getElementById('explanation-box').classList.add('show');

            const nextBtn = document.getElementById('next-btn');
            nextBtn.innerText = (currentQuestionIndex === quizData.length - 1) ? "Finish Quiz" : "Next Question";
            nextBtn.classList.add('show');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('progress-bar').style.width = `100%`;
            document.getElementById('quiz-screen').style.display = 'none';
            
            const resultsScreen = document.getElementById('results-screen');
            resultsScreen.classList.add('show');

            document.getElementById('final-score').innerText = `${score}/${quizData.length}`;
            
            const messageEl = document.getElementById('results-message');
            const percent = (score / quizData.length) * 100;
            
            if (percent >= 90) {
                messageEl.innerText = "Outstanding! You cracked the codes perfectly.";
            } else if (percent >= 70) {
                messageEl.innerText = "Great job! You have a solid grasp on these patterns.";
            } else if (percent >= 50) {
                messageEl.innerText = "Good effort, but you need more practice with position values.";
            } else {
                messageEl.innerText = "Keep practicing! Memorizing alphabetical positions and their opposites is key.";
            }
        }

        window.onload = initQuiz;
    </script>
</body>
