<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC CGL Verbal Analogy Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --correct: #10b981;
            --incorrect: #ef4444;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            max-width: 700px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background-color: var(--border);
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Question */
        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Options */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 15px 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-weight: 500;
            color: var(--text-main);
        }

        .option:hover:not(.disabled) {
            background: #f9fafb;
            border-color: #d1d5db;
        }

        .option.disabled {
            cursor: not-allowed;
        }

        .option.correct {
            background: #ecfdf5;
            border-color: var(--correct);
            color: #065f46;
        }

        .option.incorrect {
            background: #fef2f2;
            border-color: var(--incorrect);
            color: #991b1b;
        }

        /* Explanation Box */
        .explanation-box {
            background: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 25px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .explanation-box.show {
            display: block;
        }

        .explanation-title {
            font-weight: 700;
            color: #1e3a8a;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .explanation-text {
            color: #1e40af;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Controls */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
            display: none;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        /* Results Screen */
        .results-screen {
            text-align: center;
            display: none;
        }

        .results-screen.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #eff6ff;
            border: 6px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin: 0 auto 20px;
        }

        .results-message {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .results-subtext {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Quiz Screen -->
        <div id="quiz-screen">
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            
            <div class="header">
                <span id="question-tracker">Question 1 of 50</span>
                <span id="score-tracker">Score: 0</span>
            </div>

            <div class="question-text" id="question-text">
                Loading question...
            </div>

            <div class="options-grid" id="options-grid">
                <!-- Options injected via JS -->
            </div>

            <div class="explanation-box" id="explanation-box">
                <div class="explanation-title">Explanation:</div>
                <div class="explanation-text" id="explanation-text"></div>
            </div>

            <button class="btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
        </div>

        <!-- Results Screen -->
        <div class="results-screen" id="results-screen">
            <div class="score-circle" id="final-score">0/50</div>
            <div class="results-message" id="results-message">Great effort!</div>
            <div class="results-subtext" id="results-subtext">You have completed the SSC CGL Analogy Quiz.</div>
            <button class="btn show" onclick="restartQuiz()">Restart Quiz</button>
        </div>
    </div>

    <script>
        // 50 SSC CGL Level Verbal Analogy Questions
        const rawQuestions = [
            { q: "Ocean : Water :: Glacier : ?", options: ["Ice", "Mountain", "Cave", "Snow"], a: "Ice", exp: "An ocean is entirely made of water, just as a glacier is entirely made of ice." },
            { q: "Architect : Building :: Sculptor : ?", options: ["Statue", "Museum", "Chisel", "Stone"], a: "Statue", exp: "An architect designs a building, while a sculptor creates a statue." },
            { q: "Clock : Time :: Thermometer : ?", options: ["Temperature", "Heat", "Energy", "Radiation"], a: "Temperature", exp: "A clock is an instrument used to measure time. Similarly, a thermometer measures temperature." },
            { q: "Doctor : Diagnosis :: Judge : ?", options: ["Judgment", "Court", "Lawyer", "Punishment"], a: "Judgment", exp: "A doctor's primary role is to provide a diagnosis, just as a judge's role is to deliver a judgment." },
            { q: "Influenza : Virus :: Typhoid : ?", options: ["Bacteria", "Parasite", "Fungi", "Disease"], a: "Bacteria", exp: "Influenza is caused by a virus, whereas Typhoid is caused by bacteria." },
            { q: "Pen : Poet :: Needle : ?", options: ["Tailor", "Thread", "Button", "Sewing"], a: "Tailor", exp: "A pen is the primary tool of a poet, just as a needle is the primary tool of a tailor." },
            { q: "Lion : Den :: Rabbit : ?", options: ["Burrow", "Trench", "Hole", "Pit"], a: "Burrow", exp: "A lion's natural habitat/home is a den. A rabbit's home is a burrow." },
            { q: "Botany : Plants :: Entomology : ?", options: ["Insects", "Animals", "Birds", "Snakes"], a: "Insects", exp: "Botany is the scientific study of plants. Entomology is the study of insects." },
            { q: "Fish : Shoal :: Sheep : ?", options: ["Flock", "Herd", "Swarm", "Mob"], a: "Flock", exp: "A group of fish is called a shoal. A group of sheep is called a flock." },
            { q: "Fire : Ashes :: Explosion : ?", options: ["Debris", "Sound", "Flame", "Death"], a: "Debris", exp: "Fire leaves behind ashes after burning. An explosion leaves behind debris." },
            { q: "Dog : Rabies :: Mosquito : ?", options: ["Malaria", "Plague", "Death", "Sting"], a: "Malaria", exp: "A bite from an infected dog causes rabies. A bite from an infected mosquito causes malaria." },
            { q: "Horse : Neigh :: Elephant : ?", options: ["Trumpet", "Roar", "Grunt", "Whine"], a: "Trumpet", exp: "The sound made by a horse is a neigh. The sound made by an elephant is a trumpet." },
            { q: "Genuine : Authentic :: Mirage : ?", options: ["Illusion", "Image", "Reflection", "Hideout"], a: "Illusion", exp: "Genuine and Authentic are synonyms. Similarly, Mirage and Illusion are synonyms." },
            { q: "Eye : Myopia :: Teeth : ?", options: ["Pyorrhea", "Cataract", "Trachoma", "Eczema"], a: "Pyorrhea", exp: "Myopia is a disease related to the eye. Pyorrhea is a disease related to the teeth." },
            { q: "USA : Congress :: Japan : ?", options: ["Diet", "Parliament", "Cortes", "Duma"], a: "Diet", exp: "The supreme legislative body in the USA is called Congress. In Japan, it is called the Diet." },
            { q: "Tractor : Trailer :: Horse : ?", options: ["Cart", "Saddle", "Stable", "Engine"], a: "Cart", exp: "A tractor pulls a trailer. Similarly, a horse pulls a cart." },
            { q: "Sorrow : Cry :: Mirth : ?", options: ["Laugh", "Joy", "Frown", "Weep"], a: "Laugh", exp: "Sorrow is expressed through crying. Mirth (amusement) is expressed through laughing." },
            { q: "Odometer : Distance :: Sphygmomanometer : ?", options: ["Blood Pressure", "Heartbeat", "Atmospheric Pressure", "Wind Speed"], a: "Blood Pressure", exp: "An odometer measures distance. A sphygmomanometer measures blood pressure." },
            { q: "Tree : Forest :: Grass : ?", options: ["Lawn", "Garden", "Park", "Field"], a: "Lawn", exp: "A large collection of trees makes a forest. A spread of grass makes a lawn." },
            { q: "Disease : Pathology :: Planet : ?", options: ["Astronomy", "Astrology", "Geology", "Paleontology"], a: "Astronomy", exp: "Pathology is the study of diseases. Astronomy is the study of celestial bodies like planets." },
            { q: "Meat : Vegetarian :: Alcohol : ?", options: ["Teetotaler", "Drunkard", "Dietician", "Smoker"], a: "Teetotaler", exp: "A vegetarian abstains from meat. A teetotaler abstains from alcohol." },
            { q: "Volcano : Lava :: Fire : ?", options: ["Smoke", "Light", "Heat", "Burn"], a: "Smoke", exp: "A volcano emits lava. Fire emits smoke." },
            { q: "Error : Infallible :: Defect : ?", options: ["Flawless", "Perfect", "Mistake", "Clean"], a: "Flawless", exp: "Someone who makes no errors is infallible. Something with no defects is flawless." },
            { q: "Circle : Circumference :: Square : ?", options: ["Perimeter", "Area", "Diagonal", "Volume"], a: "Perimeter", exp: "The outer boundary of a circle is its circumference. The outer boundary of a square is its perimeter." },
            { q: "Canvas : Painter :: Marble : ?", options: ["Sculptor", "Architect", "Mason", "Builder"], a: "Sculptor", exp: "A painter works on a canvas. A sculptor works on marble." },
            { q: "Day : Night :: Dawn : ?", options: ["Dusk", "Evening", "Morning", "Twilight"], a: "Dusk", exp: "Day and Night are opposites. Dawn (morning start) and Dusk (evening end) are opposites." },
            { q: "Coal : Heat :: Wax : ?", options: ["Light", "Energy", "Bee", "Candle"], a: "Light", exp: "Burning coal produces heat. Burning wax produces light." },
            { q: "Mountain : Hill :: Tree : ?", options: ["Shrub", "Leaf", "Forest", "Branch"], a: "Shrub", exp: "A hill is a smaller version of a mountain. A shrub is a smaller version of a tree." },
            { q: "Cobbler : Leather :: Carpenter : ?", options: ["Wood", "Furniture", "Hammer", "Nails"], a: "Wood", exp: "A cobbler's primary raw material is leather. A carpenter's primary raw material is wood." },
            { q: "Poverty : Prosperity :: Intelligence : ?", options: ["Stupidity", "Power", "Education", "Wealth"], a: "Stupidity", exp: "Poverty and Prosperity are antonyms. Intelligence and Stupidity are antonyms." },
            { q: "Safe : Secure :: Protect : ?", options: ["Guard", "Lock", "Sure", "Conserve"], a: "Guard", exp: "Safe and Secure are synonyms. Protect and Guard are synonyms." },
            { q: "King : Throne :: Rider : ?", options: ["Saddle", "Horse", "Seat", "Stirrup"], a: "Saddle", exp: "A king sits on a throne. A rider sits on a saddle." },
            { q: "Thread : Cloth :: Wire : ?", options: ["Mesh", "Radio", "Telegraph", "Copper"], a: "Mesh", exp: "Cloth is made by weaving thread. Mesh is made by weaving wire." },
            { q: "Car : Garage :: Aeroplane : ?", options: ["Hangar", "Port", "Depot", "Harbour"], a: "Hangar", exp: "A car is parked in a garage. An aeroplane is housed in a hangar." },
            { q: "Menu : Food :: Catalogue : ?", options: ["Books", "Rack", "Newspaper", "Library"], a: "Books", exp: "A menu is a list of food items. A catalogue is a list of books or products." },
            { q: "Book : Publisher :: Film : ?", options: ["Producer", "Director", "Editor", "Writer"], a: "Producer", exp: "A publisher funds and brings a book to market. A producer does the same for a film." },
            { q: "Gun : Bullet :: Chimney : ?", options: ["Smoke", "Fire", "Roof", "House"], a: "Smoke", exp: "A gun forcefully ejects a bullet. A chimney ejects smoke." },
            { q: "Darkness : Lamp :: Thirst : ?", options: ["Water", "Drink", "Juice", "Mouth"], a: "Water", exp: "A lamp removes darkness. Water removes thirst." },
            { q: "Good : Bad :: Roof : ?", options: ["Floor", "Wall", "Window", "Pillar"], a: "Floor", exp: "Good is the opposite of bad. Roof (top) is the opposite of floor (bottom)." },
            { q: "Light : Blind :: Speech : ?", options: ["Dumb", "Deaf", "Tongue", "Sound"], a: "Dumb", exp: "A blind person cannot perceive light. A dumb (mute) person cannot produce speech." },
            { q: "Whisper : Speak :: Brush : ?", options: ["Touch", "Sweep", "Wash", "Clean"], a: "Touch", exp: "To whisper is to speak softly. To brush is to touch lightly." },
            { q: "Water : Convection :: Space : ?", options: ["Radiation", "Conduction", "Vacuum", "Transfer"], a: "Radiation", exp: "Heat travels in water through convection. Heat travels in space through radiation." },
            { q: "Ink : Pen :: Blood : ?", options: ["Vein", "Heart", "Accident", "Doctor"], a: "Vein", exp: "Ink flows inside a pen. Blood flows inside a vein." },
            { q: "Race : Fatigue :: Fast : ?", options: ["Hunger", "Food", "Race", "Weakness"], a: "Hunger", exp: "Running a race causes fatigue. Observing a fast causes hunger." },
            { q: "Symphony : Composer :: Fresco : ?", options: ["Painter", "Singer", "Sculptor", "Author"], a: "Painter", exp: "A composer creates a symphony. A painter creates a fresco (a type of mural painting)." },
            { q: "Grain : Granary :: Curios : ?", options: ["Museum", "Archive", "Library", "Zoo"], a: "Museum", exp: "Grains are stored in a granary. Curios (historical artifacts) are stored in a museum." },
            { q: "Sword : Slaughter :: Scalpel : ?", options: ["Surgery", "Murder", "Chop", "Bleed"], a: "Surgery", exp: "A sword is used for slaughtering in war. A scalpel is used for surgery in medicine." },
            { q: "Coconut : Shell :: Letter : ?", options: ["Envelope", "Stamp", "Mailbox", "Postman"], a: "Envelope", exp: "A shell protects the inside of a coconut. An envelope encloses and protects a letter." },
            { q: "Bird : Aviary :: Bees : ?", options: ["Apiary", "Hive", "Aquarium", "Sanctuary"], a: "Apiary", exp: "Birds are kept in an aviary. Bees are kept in an apiary." },
            { q: "Flower : Butterfly :: Dirt : ?", options: ["Fly", "Rat", "Bug", "Dust"], a: "Fly", exp: "Butterflies are attracted to flowers. Flies are attracted to dirt/garbage." }
        ];

        let quizData = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        // Utility function to shuffle an array (Fisher-Yates)
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function initQuiz() {
            // Reset state
            currentQuestionIndex = 0;
            score = 0;
            
            // Shuffle questions
            quizData = shuffleArray(rawQuestions);
            
            // Hide results, show quiz
            document.getElementById('results-screen').classList.remove('show');
            document.getElementById('quiz-screen').style.display = 'block';
            
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            const currentQ = quizData[currentQuestionIndex];
            
            // Update UI Trackers
            document.getElementById('question-tracker').innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            document.getElementById('score-tracker').innerText = `Score: ${score}`;
            
            // Update Progress Bar
            const progressPercent = ((currentQuestionIndex) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Set Question Text
            document.getElementById('question-text').innerText = currentQ.q;

            // Shuffle and Render Options
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = ''; // Clear previous
            
            const shuffledOptions = shuffleArray(currentQ.options);
            
            shuffledOptions.forEach(opt => {
                const button = document.createElement('button');
                button.className = 'option';
                button.innerText = opt;
                button.onclick = () => selectOption(button, opt, currentQ.a, currentQ.exp);
                optionsGrid.appendChild(button);
            });

            // Reset Explanation and Next Button
            const expBox = document.getElementById('explanation-box');
            expBox.classList.remove('show');
            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.remove('show');
        }

        function selectOption(selectedBtn, selectedText, correctText, explanation) {
            if (answered) return; // Prevent multiple clicks
            answered = true;

            const allOptions = document.querySelectorAll('.option');
            
            // Evaluate correctness
            if (selectedText === correctText) {
                selectedBtn.classList.add('correct');
                score++;
                document.getElementById('score-tracker').innerText = `Score: ${score}`;
            } else {
                selectedBtn.classList.add('incorrect');
                // Highlight the correct one
                allOptions.forEach(btn => {
                    if (btn.innerText === correctText) {
                        btn.classList.add('correct');
                    }
                });
            }

            // Disable all options
            allOptions.forEach(btn => {
                btn.classList.add('disabled');
            });

            // Show Explanation
            document.getElementById('explanation-text').innerText = explanation;
            document.getElementById('explanation-box').classList.add('show');

            // Show Next Button
            const nextBtn = document.getElementById('next-btn');
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtn.innerText = "Finish Quiz";
            } else {
                nextBtn.innerText = "Next Question";
            }
            nextBtn.classList.add('show');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            // Final update to progress bar
            document.getElementById('progress-bar').style.width = `100%`;
            
            // Hide quiz, show results
            document.getElementById('quiz-screen').style.display = 'none';
            const resultsScreen = document.getElementById('results-screen');
            resultsScreen.classList.add('show');

            // Set results data
            document.getElementById('final-score').innerText = `${score}/${quizData.length}`;
            
            const messageEl = document.getElementById('results-message');
            const percent = (score / quizData.length) * 100;
            
            if (percent >= 90) {
                messageEl.innerText = "Excellent! You are definitely CGL ready!";
            } else if (percent >= 70) {
                messageEl.innerText = "Good job! A little more practice and you'll be perfect.";
            } else if (percent >= 50) {
                messageEl.innerText = "Not bad, but you need to revise your concepts.";
            } else {
                messageEl.innerText = "Keep practicing! Analogy requires strong vocabulary and general awareness.";
            }
        }

        function restartQuiz() {
            initQuiz();
        }

        // Start the quiz on load
        window.onload = initQuiz;

    </script>
</body>
</html>
